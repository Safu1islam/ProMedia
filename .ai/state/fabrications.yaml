# .ai/state/fabrications.yaml
# Schema: aef/schemas/fabrication.schema.yaml
#
# Registered at creation time, per Constitution section 6.
# No release may proceed with an active fabrication where visible_to_user is true.

fabrications:

  - id: F-001
    created_by_task: T-012
    created_at: "2026-08-08"
    kind: fake_api
    location: promedia/core/publishers/stub.py
    what_is_fake: >
      StubPublisher.publish() returns a fabricated platform post id and publishes
      nothing, anywhere. verify_published() always returns False.
    why: >
      No platform credentials exist, and X/LinkedIn API access terms and pricing
      must be verified against live documentation rather than model memory
      (operator instruction; project.md O-3). Building live adapters against
      unverified assumptions would be sunk work.
    visible_to_user: true
    visibility_note: >
      THE HIGHEST-RISK FABRICATION IN THE SYSTEM. A simulated publish that looked
      real would be indistinguishable from a real one in the UI. Three guards:
      (1) unreachable unless publishing.allow_simulation is explicitly true, and
      it is false in promedia.toml; (2) every result carries simulated=true which
      reaches the publication record and the dashboard banner; (3) the platform
      post id contains the literal string SIMULATED-NOT-PUBLISHED rather than a
      plausible identifier.
    replacement_condition: >
      Operator supplies X and LinkedIn credentials AND access terms, rate limits
      and pricing are verified against live platform documentation.
    replacement_task: T-019
    status: active
    blocks_release: true

  - id: F-002
    created_by_task: T-006
    created_at: "2026-08-08"
    kind: placeholder
    location: promedia/core/credentials.py
    what_is_fake: >
      The CredentialStore file backend writes credentials as plaintext JSON.
      DR-008 specifies Windows DPAPI (per-user OS encryption) as the intended
      backend; the interface is in place but the encryption is not.
    why: >
      Shipping a Windows-only native-interface dependency was deferred so the v1
      slice could be built and verified first. The decision that matters in
      DR-008 — separation of credentials from the repository and from the
      database, so they are absent from every backup and export — IS implemented
      and tested (tests/test_credentials.py).
    visible_to_user: false
    replacement_condition: "DPAPI backend implemented behind the same interface."
    replacement_task: T-022
    status: resolved
    resolved_at: "2026-08-13"
    resolved_by_task: T-022
    blocks_release: false
    residual_risk: >
      HISTORICAL, describing the plaintext file this entry tracked: plaintext at
      rest under the operator profile. On a single-user machine an attacker with
      the operator's live session defeats DPAPI too, so the real exposure delta
      was narrower than it appeared — but it was not zero, and it was not
      silently accepted.
    resolution: >
      promedia/core/dpapi.py binds credentials to the Windows user via
      CryptProtectData, and CredentialStore writes base64 DPAPI blobs behind the
      unchanged interface — the swap DR-008 predicted, with no caller change.
      An existing plaintext store is still read and is re-encrypted on the next
      write, so it upgrades by being used. tests/test_dpapi.py (18 tests)
      asserts the secret and the operator token are absent from the file, that
      the store records which backend it is, and that DPAPI cannot silently
      degrade to plaintext when unavailable — it refuses instead.
    residual_risk_now: >
      NOT eliminated, narrowed. DPAPI closes the COPIED-FILE case: a backup, a
      synced folder or a stolen disk read from another Windows account cannot be
      decrypted. It does not defend against code running AS the operator in the
      operator's live session, which can call CryptUnprotectData exactly as this
      code does. On a single-user machine that is the realistic attacker, so the
      honest claim is 'credentials are no longer readable outside this user
      account', not 'credentials are encrypted' full stop.
    not_verified: >
      AC-1's literal statement — ciphertext copied to ANOTHER Windows account
      cannot be decrypted — has NOT been executed, because it needs a second
      Windows account this machine does not have. What is verified: a blob
      produced under different key-derivation entropy fails to decrypt (the same
      failure path), and CRYPTPROTECT_LOCAL_MACHINE is asserted absent from the
      call by AST inspection, since that flag is precisely what would downgrade
      user-binding to machine-binding and make the cross-account case pass
      trivially.

notes:
  - >
    T-028's parity probes use a sentinel identifier
    ('parity-probe-no-such-entity') and empty-JSON parameter values. These are
    NOT registered as fabrications because nothing fake is produced or shown:
    they are inputs chosen to match no entity, and the tests assert that both
    surfaces refuse them identically. A sentinel that produced a plausible
    result would have been a fabrication; one that produces NOT_FOUND is a
    probe. The tests also assert publishing.allow_simulation is false, so
    fabrication F-001 stays unreachable while they run.
  - >
    T-027's tests/test_locking.py monkeypatches promedia.core.rights.determine in
    four tests. Three replace it with a PROBE that reads the lock table (or makes
    a second agent's attempt) from inside the handler and then calls the real
    implementation — a window into a lock that only exists while the handler
    runs, not a substitute for it. The fourth injects a ZeroDivisionError to
    reach the unexpected-exception release path. Neither is registered as a
    fabrication: nothing fake is produced, nothing reaches the operator or the
    database, and no assertion is satisfied by invented data. A probe that
    returned a fabricated verdict instead of delegating WOULD have been one.
  - >
    T-031's tests/test_hardening.py monkeypatches promedia.web.app.load_operations
    in five tests, to REMOVE one entry from the real registry as seen by the web
    adapter. Not registered as a fabrication: nothing fake is produced or
    substituted — it is a subtraction from a real mapping, which is precisely the
    manoeuvre the fix must make safe, and every assertion is that the request was
    REFUSED and that no account, credential or publication came into existence. A
    stub registry returning invented operations WOULD have been one. One of those
    tests runs with publishing.allow_simulation true and, before the fix, reached
    fabrication F-001 and produced a simulated publication over GET; after the
    fix the same test asserts publications count == 0.
  - >
    ffprobe is absent on this machine, so media duration and codec are recorded
    as null with probe_status 'unavailable'. That is NOT registered as a
    fabrication because nothing fake is produced: the absence is recorded
    honestly and tested (test_ingest.py::test_missing_probe_records_unavailable_not_guess).
    A guessed duration would have been a fabrication.
