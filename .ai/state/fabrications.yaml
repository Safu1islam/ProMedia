  - id: F-006
    created_by_task: T-043
    created_at: "2026-08-14"
    kind: unverified_constant
    location: promedia/config.py — media.render_size_safety_margin
    what_is_fake: >
      A 1.25 multiplier applied on top of the duration x bitrate render-size
      projection. A round number, not derived from any observed distribution
      of estimate errors — none exists yet, because T-043 is the first place
      a projected byte figure is ever reconciled against a real, measured one
      via storage.commit().
    why: >
      The projection has to exist before the render runs, and no error
      distribution can be measured until real renders have gone through
      commit() and been compared. A safety margin has to ship with some
      value; this one is a guess in the safe direction (over-reservation),
      not an estimate from data.
    visible_to_user: false
    visibility_note: >
      Not user-visible: it only affects a transient over-reservation during
      the render window, which storage.commit() always corrects to the true
      byte count immediately after. No verdict, ledger total, or displayed
      figure is ever wrong because of it once a render completes.
    replacement_condition: >
      Enough real renders have gone through commit() to compare
      projected_bytes against committed_bytes and compute an actual error
      distribution; tighten or loosen from measured data rather than a guess.
    replacement_task: null
    status: active
    blocks_release: false

