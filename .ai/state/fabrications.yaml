  - id: F-008
    created_by_task: T-043
    created_at: "2026-08-14"
    kind: unverified_constant
    location: promedia/config.py — media.unknown_clip_duration_seconds
    what_is_fake: >
      A 60-second per-clip fallback duration, used only when a clip runs to
      the end of its source and that source's duration was never probed
      (residue of retired assumption A-15 — probing absent or failed at
      ingest). Not a measurement of anything; a deliberately generous guess
      so the render-size projection has a number to use.
    why: >
      Duration must be known to project render size before encoding starts
      (AC-1). Almost every source now carries a real ffprobe duration since
      A-15's retirement, but the case where probing itself failed still
      needs a value rather than a crash or a silent zero.
    visible_to_user: false
    visibility_note: >
      Every render result whose projection used this fallback carries
      storage.duration_measured=False, specifically so the estimate is never
      read downstream as a real measurement. No verdict or ledger total is
      permanently wrong because of it — storage.commit() reconciles to the
      real output size regardless of which duration the projection used.
    replacement_condition: >
      Becomes moot once every stored asset has a probed duration (ffmpeg 9.0
      is already installed per A-15's retirement in T-041); until then it is
      the honest fallback for the residual case where probing itself failed.
    replacement_task: null
    status: active
    blocks_release: false

