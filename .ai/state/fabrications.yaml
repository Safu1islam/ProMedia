fabrications:

  - id: F-001
    created_by_task: T-012
    created_at: "2026-08-08"
    kind: fake_api
    location: promedia/core/publishers/stub.py
    what_is_fake: >
      StubPublisher.publish() returns a fabricated platform post id and publishes
      nothing, anywhere. verify_published() always returns False.
    why: >
      No platform credentials exist, and X/LinkedIn API access terms and pricing
      must be verified against live documentation rather than model memory
      (operator instruction; project.md O-3). Building live adapters against
      unverified assumptions would be sunk work.
    visible_to_user: true
    visibility_note: >
      THE HIGHEST-RISK FABRICATION IN THE SYSTEM. A simulated publish that looked
      real would be indistinguishable from a real one in the UI. Three guards:
      (1) unreachable unless publishing.allow_simulation is explicitly true, and
      it is false in promedia.toml; (2) every result carries simulated=true which
      reaches the publication record and the dashboard banner; (3) the platform
      post id contains the literal string SIMULATED-NOT-PUBLISHED rather than a
      plausible identifier.
    replacement_condition: >
      Operator supplies X and LinkedIn credentials AND access terms, rate limits
      and pricing are verified against live platform documentation.
    replacement_task: T-019
    status: active
    blocks_release: true

  - id: F-002
    created_by_task: T-006
    created_at: "2026-08-08"
    kind: placeholder
    location: promedia/core/credentials.py
    what_is_fake: >
      The CredentialStore file backend writes credentials as plaintext JSON.
      DR-008 specifies Windows DPAPI (per-user OS encryption) as the intended
      backend; the interface is in place but the encryption is not.
    why: >
      Shipping a Windows-only native-interface dependency was deferred so the v1
      slice could be built and verified first. The decision that matters in
      DR-008 — separation of credentials from the repository and from the
      database, so they are absent from every backup and export — IS implemented
      and tested (tests/test_credentials.py).
    visible_to_user: false
    replacement_condition: "DPAPI backend implemented behind the same interface."
    replacement_task: T-022
    status: resolved
    resolved_at: "2026-08-13"
    resolved_by_task: T-022
    blocks_release: false
    residual_risk: >
      HISTORICAL, describing the plaintext file this entry tracked: plaintext at
      rest under the operator profile. On a single-user machine an attacker with
      the operator's live session defeats DPAPI too, so the real exposure delta
      was narrower than it appeared — but it was not zero, and it was not
      silently accepted.
    resolution: >
      promedia/core/dpapi.py binds credentials to the Windows user via
      CryptProtectData, and CredentialStore writes base64 DPAPI blobs behind the
      unchanged interface — the swap DR-008 predicted, with no caller change.
      An existing plaintext store is still read and is re-encrypted on the next
      write, so it upgrades by being used. tests/test_dpapi.py (18 tests)
      asserts the secret and the operator token are absent from the file, that
      the store records which backend it is, and that DPAPI cannot silently
      degrade to plaintext when unavailable — it refuses instead.
    residual_risk_now: >
      NOT eliminated, narrowed. DPAPI closes the COPIED-FILE case: a backup, a
      synced folder or a stolen disk read from another Windows account cannot be
      decrypted. It does not defend against code running AS the operator in the
      operator's live session, which can call CryptUnprotectData exactly as this
      code does. On a single-user machine that is the realistic attacker, so the
      honest claim is 'credentials are no longer readable outside this user
      account', not 'credentials are encrypted' full stop.
    not_verified: >
      AC-1's literal statement — ciphertext copied to ANOTHER Windows account
      cannot be decrypted — has NOT been executed, because it needs a second
      Windows account this machine does not have. What is verified: a blob
      produced under different key-derivation entropy fails to decrypt (the same
      failure path), and CRYPTPROTECT_LOCAL_MACHINE is asserted absent from the
      call by AST inspection, since that flag is precisely what would downgrade
      user-binding to machine-binding and make the cross-account case pass
      trivially.

  - id: F-003
    created_by_task: T-041
    created_at: "2026-08-13"
    kind: silent_substitution
    location: promedia/core/media/render.py — _clip_chain
    what_is_fake: >
      The EDL advertises SEVEN transitions and the renderer implements THREE.
      `edl.py` validates `transition_in` against TRANSITIONS and REJECTS
      anything outside it, so the vocabulary is an active promise about what is
      supported — not an open string field a caller might be expected to check.

      Measured against _clip_chain, transition by transition:

        cut         -> no filter. CORRECT; a cut is the absence of a transition.
        fade        -> fade from black. CORRECT.
        dissolve    -> fade from black. WRONG TRANSITION. A true cross-dissolve
                       blends the tail of the outgoing clip into the head of the
                       incoming one, which looks materially different and is what
                       the word means to anyone who edits video.
        wipeleft    -> NO FILTER AT ALL. Renders as a hard cut, silently.
        wiperight   -> NO FILTER AT ALL. Renders as a hard cut, silently.
        slideup     -> NO FILTER AT ALL. Renders as a hard cut, silently.
        slidedown   -> NO FILTER AT ALL. Renders as a hard cut, silently.

      SCOPE CORRECTED 2026-08-13 by independent audit (session audit-0813).
      This entry originally named `dissolve` alone. The four wipe and slide
      values are the same defect and arguably worse: dissolve at least produces
      a visible effect, while a wipe produces nothing whatsoever and the render
      still reports success. Verified by execution against _clip_chain, not by
      reading — each of the seven was constructed and its emitted filter chain
      inspected.
    why: >
      The graph concatenates clips, and concat carries no absolute timeline
      offsets. ffmpeg's xfade filter needs them, so a real cross-dissolve
      requires a different composition model than the one T-041 built.
      Implementing that inside T-041 would have been a redesign of the graph on
      the way past, rather than the foundation the task was scoped to deliver.
    visible_to_user: true
    visibility_note: >
      REGISTERED BECAUSE IT WAS ALMOST NOT. The implementing session recorded
      this as an "assumption" in the task, which was the wrong register:
      Constitution section 6 covers anything where the system accepts one
      instruction and does another without saying so. An operator or agent asks
      for a dissolve, the render succeeds, and nothing anywhere reports that
      they got a fade. A silent substitution that SUCCEEDS is more dangerous
      than a failure, because nothing prompts anyone to look.
    replacement_condition: >
      An absolute-offset composition model that can express overlapping clips,
      allowing xfade. Recorded in DR-016 revisit_if.
    replacement_task: T-045
    status: resolved
    resolved_at: "2026-08-14"
    resolved_by_task: T-045
    blocks_release: false
    interim_mitigation: >
      SUPERSEDED. Reporting the substitution shipped in T-042 and worked as
      intended; it is now moot because there is nothing left to report.
    resolution: >
      T-045 replaced the concat-based composition model with an
      absolute-offset one (render._compose_timeline), letting adjacent
      segments be stitched with ffmpeg's real xfade (video) / acrossfade
      (audio) filters at a computed offset instead of a plain concat.
      render.TRANSITION_REALITY now maps all seven vocabulary entries to
      None (no substitution) rather than three.

      Verified per transition, not taken from the implementing agent's report
      alone (that report only measured 'dissolve' before the session ended —
      see .ai/HANDOFF-2026-08-14-parallel-run.md §3):
        - dissolve: at the transition's exact midpoint (t=2.5s, red->blue,
          1.0s dissolve over 3+3s clips) the decoded frame shows R=119.9
          G=7.5 B=132.2, mean luminance 86.5 — a genuine blend of both source
          colours, sharply distinct from the same edit with 'fade' at its
          midpoint (mean luminance 43.7, and 0.0/pure black at the cut
          point). tests/test_transitions.py::test_dissolve_blends_both_clips_at_the_midpoint_ac1.
        - wipeleft / wiperight / slideup / slidedown: independently rendered
          and pixel-sampled by REGION (not whole-frame mean, since these are
          spatially directional) at the same t=2.5s midpoint. Each shows a
          clean, sharp, correctly-oriented 50/50 spatial split between the
          two source colours — wipeleft: left half still red (R=243.6),
          right half already blue (B=254.0); wiperight: the mirror image;
          slideup: top red / bottom blue; slidedown: top blue / bottom red —
          with duration correctly overlap-subtracted to 5.00s in every case.
          A uniform blend (dissolve's signature) or an unsplit frame (a hard
          cut, or a mislabelled/defaulted transition) would both have failed
          this check; none did. Script and raw output available in this
          session's scratchpad if needed again.
      Structural regression coverage:
      tests/test_transitions.py::test_every_previously_silent_hard_cut_now_emits_its_own_xfade
      and ::test_every_previously_hard_cut_transition_renders_without_error
      (parametrised over all four), plus
      tests/test_projects.py::test_every_advertised_transition_is_either_implemented_or_reported,
      which asserts EDL.TRANSITIONS and render.TRANSITION_REALITY match as a
      rule over the whole vocabulary — so a transition added later without a
      real implementation fails this immediately, not eventually.
      tests/test_projects.py and tests/test_editor_ui.py's eight tests that
      asserted the old substitution behaviour were rewritten (coordinator,
      2026-08-14) to assert the new one; none was deleted. Two of the
      editor_ui rewrites (test_the_marking_can_actually_go_missing,
      test_dashboard_flags_a_substitution_if_one_is_ever_recorded) now prove
      the WARNING MACHINERY itself still works, by forcing a substitution
      back in via monkeypatch/direct row edit, since no real transition can
      exercise that path honestly anymore.

