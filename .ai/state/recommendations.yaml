    recommendation: "In promedia/core/projects.py's _register_render_asset, when a new render's output byte-for-byte matches an EXISTING asset's content_hash, the function returns the existing asset id immediately without checking whether the new render's own governing (worst-verdict) source matches the existing row's derived_from. Either document this as a known limitation next to the dedup branch (and in .ai/state/fabrications.yaml if judged to rise to that), or make the dedup key stricter (e.g. also compare governing source / verdict before short-circuiting)."
    reason: "Independent review of T-044 (background agent, 2026-08-15): two separately-ingested assets with different content_hash (so not deduped at ingest) but perceptually identical decoded video could plausibly produce byte-identical ffmpeg output when each is rendered with identical settings. If the second render's true governing source is later BLOCKED while the first render's registered derived_from source stays PERMITTED, a post against the shared (deduped) asset id stays wrongly approvable -- effective_verdict only ever follows the FIRST render's ancestry chain. Existing test test_register_render_asset_deduplicates_identical_content only exercises the same-governing-source case, not this cross-governing-source one."
    expected_benefit: "Either closes or explicitly discloses a narrow F-4/F-5 rights-laundering edge case before it is relied upon."
