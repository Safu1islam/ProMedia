  - id: "R-007"
    title: "config.defaults() shallow-copies nested dict VALUES, risking cross-process leakage"
    raised_by: "claude-code-coordinator-0814"
    raised_by_agent: "architect"
    during_task: "T-043"
    raised_at: "2026-08-14T06:07:47+04:00"
    recommendation: "Deep-copy nested dict values inside config.py's defaults()/_deep_merge machinery, not just the top-level section dict, so an in-place mutation of a nested config value cannot leak across every Config built without a promedia.toml override for the rest of the process."
    reason: "T-043 added media.estimated_bitrate_bytes_per_second, the first nested-dict config value in this codebase. Nothing in T-043 mutates it in place, but nothing in config.py's copy logic would stop a future caller from doing cfg.values['media']['estimated_bitrate_bytes_per_second']['fast'] = X and having that mutation persist across every subsequently constructed default Config, including other tests, within the same process."
    expected_benefit: "Closes a latent correctness hazard before a second nested-dict config value makes the risk concrete, and before a hard-to-diagnose test-order-dependent failure surfaces from it."
    risk: "config.py is shared across every concurrent task in this run; touching its defaults()/_deep_merge machinery needs its own claim and a careful pass, not a drive-by edit."
    affected_components:
      - "promedia/config.py"
    severity: "minor"
    status: "accepted"
    resolution:
      decided_by: "claude-code-r006r007"
      decided_at: "2026-08-15T00:00:00+04:00"
      reason: "Fixed directly, at both call sites the recommendation named: defaults() and _deep_merge() now build on copy.deepcopy(...) instead of a one-level dict copy, closing the leak at every nesting depth rather than patching the one known level. _deep_merge specifically mattered because load() calls it with the module-level DEFAULTS directly, not through defaults() — the branch the old one-level copy in _deep_merge itself left half-fixed. 4 new regression tests in tests/test_hygiene.py, including one that goes through a real promedia.toml file (the _deep_merge path). Investigated a C-4 cold-start test failure that surfaced during verification (deepcopy is on the CLI cold-start path) and confirmed by reproduction that it is pre-existing machine-load noise, not caused by this fix — see T-062's verification record.\n"
      became_task: "T-062"
