# .ai/state/recommendations.yaml — proposals nobody has authorised yet.
# Schema: aef/schemas/recommendation.schema.yaml
#
# MACHINE-MANAGED. Written by `aef.py recommend ...`.
#
# A rejected recommendation is kept, with its reason. That is the point of the
# file: it stops the same idea being re-proposed every few sessions.

recommendations:
  - id: "R-001"
    title: "AEF has no home for its own project state"
    raised_by: "me-0413"
    raised_by_agent: "architect"
    during_task: "AEF-0.4.0"
    raised_at: "2026-08-13T13:29:35+04:00"
    recommendation: "Give AEF a first-class self-hosting mode so framework work is planned and tracked in AEF's own .ai/, not the host project's."
    reason: "Framework authorship is currently tracked as pseudo-tasks (AEF-0.3.0, AEF-0.4.0) in the HOST project's locks.yaml. The host's own validator correctly reports them as locks for tasks that exist in no task file — observed twice in this repository."
    expected_benefit: "Framework work gets the same plan, acceptance criteria and evidence AEF demands of every other project."
    risk: "A second .ai/ inside aef/ would ship to every vendored copy as noise unless it is excluded from the distribution."
    affected_components:
      - "aef/"
      - ".ai/state/locks.yaml"
    severity: "important"
    status: "deferred"
    resolution:
      decided_by: "operator"
      decided_at: "2026-08-13T13:29:50+04:00"
      reason: "Revisit when AEF is extracted to its own repository, which is the natural moment: the host-project workaround costs nothing until then."
  - id: "R-002"
    title: "project.md now contradicts the work the operator has authorised"
    raised_by: "next3"
    raised_by_agent: "backend-agent"
    during_task: "T-041"
    raised_at: "2026-08-13T15:54:24+04:00"
    recommendation: "Amend project.md section 4 (Out of scope) and the F-9/C-13/C-17 constraint rows, or record a superseding decision, so the project constitution states what is actually being built. Specifically: the out-of-scope line forbidding a video editor, F-9 'single operator, permanently', C-13's 100 GB ceiling, C-17 simultaneous humans = 1, and the retention policy making masters transient."
    reason: "Measured against the file, not inferred. project.md section 4 reads 'Do not build, and do not propose: a general-purpose non-linear video editor' and 'Multi-tenant SaaS, billing, other people's accounts'; F-9 reads 'Single operator, permanently. No multi-tenancy, no second human, no team model'. The operator authorised a full production platform with ID-based multi-user access on 2026-08-13, and T-041 has shipped the first phase of it. Constitution section 2 makes project.md changeable only by Intake or Amendment, so an agent cannot reconcile this. Until it is reconciled, the document a new agent reads first actively misdescribes the project."
    expected_benefit: "A new session reads project.md and gets the truth. Today it would read that the thing it was just asked to build is forbidden."
    risk: "Amending F-9 touches the authority model every rights guarantee rests on; it must be a deliberate decision record, not an edit. C-13 and the transient-masters policy are load-bearing for the storage ledger and the backup scope, so changing them reopens T-036/T-043."
    affected_components:
      - ".ai/project.md"
      - "promedia/core/storage.py"
    severity: "critical"
    status: "pending"
  - id: "R-003"
    title: "Every task this session completed is unreviewed, and the count is now seven"
    raised_by: "next3"
    raised_by_agent: "backend-agent"
    during_task: "T-041"
    raised_at: "2026-08-13T15:54:34+04:00"
    recommendation: "Route the media production tasks (T-041 onward) to a reviewing agent that did not implement them, before the platform grows further on top of them. Prioritise T-041, which is the foundation every later phase inherits."
    reason: "Constitution section 7 and framework.yaml quality.self_review_counts_as_review=false. T-018, T-022, T-030, T-033, T-035, T-036, T-037 and T-041 all carry independent_review status NOT_RUN, all implemented by claude-code-session-next3. routing.yaml puts critical-mode changes at 3 reviewers; actual is zero. The sabotage rounds performed are self-verification, which the framework explicitly does not count. Evidence that this matters rather than being a formality: two of T-036's own tests were wrong rather than the code, and were caught only because they happened to fail — a test that passes for the wrong reason is invisible from inside the implementing session."
    expected_benefit: "The foundation gets checked before four more phases are built on it, which is the cheapest moment it will ever be."
    risk: "None to the work. Cost is a reviewing agent's context."
    affected_components:
      - "promedia/core/media/"
      - ".ai/state/tasks.yaml"
    severity: "important"
    status: "pending"
  - id: "R-004"
    title: "T-045 retires F-003 but is scoped to dissolve only; four transitions would still silently do nothing"
    raised_by: "audit-0813"
    raised_by_agent: "reviewer-agent"
    during_task: "AUDIT-0813"
    raised_at: "2026-08-13T16:11:45+04:00"
    recommendation: "Widen T-045's acceptance criteria to cover every value in edl.TRANSITIONS, or narrow TRANSITIONS to what the renderer actually implements. Either closes the gap; shipping T-045 as written does not."
    reason: "Verified by execution against render._clip_chain, not by reading. edl.py:259 validates transition_in against TRANSITIONS and rejects anything outside it, so all seven are an active promise. Only cut, fade and dissolve emit anything; wipeleft, wiperight, slideup and slidedown emit no filter at all and render as a hard cut while the render reports success. T-045's AC-1 and AC-2 mention only dissolve and transition overlap, so T-045 could pass, F-003 could be closed, and four advertised transitions would still silently do nothing."
    expected_benefit: "The registry and the retirement task describe the same defect, so closing one genuinely closes the other."
    risk: "Narrowing TRANSITIONS is a breaking change to the EDL vocabulary if any saved EDL already uses a wipe. None does yet, which makes now the cheap moment."
    affected_components:
      - "promedia/core/media/edl.py"
      - "promedia/core/media/render.py"
    severity: "important"
    status: "pending"
