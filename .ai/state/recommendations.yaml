  - id: "R-002"
    title: "project.md now contradicts the work the operator has authorised"
    raised_by: "next3"
    raised_by_agent: "backend-agent"
    during_task: "T-041"
    raised_at: "2026-08-13T15:54:24+04:00"
    recommendation: "Amend project.md section 4 (Out of scope) and the F-9/C-13/C-17 constraint rows, or record a superseding decision, so the project constitution states what is actually being built. Specifically: the out-of-scope line forbidding a video editor, F-9 'single operator, permanently', C-13's 100 GB ceiling, C-17 simultaneous humans = 1, and the retention policy making masters transient."
    reason: "Measured against the file, not inferred. project.md section 4 reads 'Do not build, and do not propose: a general-purpose non-linear video editor' and 'Multi-tenant SaaS, billing, other people's accounts'; F-9 reads 'Single operator, permanently. No multi-tenancy, no second human, no team model'. The operator authorised a full production platform with ID-based multi-user access on 2026-08-13, and T-041 has shipped the first phase of it. Constitution section 2 makes project.md changeable only by Intake or Amendment, so an agent cannot reconcile this. Until it is reconciled, the document a new agent reads first actively misdescribes the project."
    expected_benefit: "A new session reads project.md and gets the truth. Today it would read that the thing it was just asked to build is forbidden."
    risk: "Amending F-9 touches the authority model every rights guarantee rests on; it must be a deliberate decision record, not an edit. C-13 and the transient-masters policy are load-bearing for the storage ledger and the backup scope, so changing them reopens T-036/T-043."
    affected_components:
      - ".ai/project.md"
      - "promedia/core/storage.py"
    severity: "critical"
    status: "accepted"
    resolution:
      decided_by: "claude-code-r002-0816"
      decided_at: "2026-08-16T00:44:00+04:00"
      reason: "Read the CURRENT .ai/project.md side by side with this recommendation's four named concerns, not from summary. All four are resolved; none is a live contradiction of anything actually shipped.\n(1) Out-of-scope video-editor line — section 4 carries the amendment directly: the struck-through original is followed by \"AMENDED 2026-08-14. The operator supplied a design mockup (`Pro Media v2.dc.html`) specifying a full multi-room production UI ... and, shown that this line forbade it, explicitly chose the full-rebuild option over two narrower alternatives. That is the NON-NEGOTIABLES.md 'explicit human approval, in the conversation, for that specific action' bar for changing this file. See DR-017.\" This is a proper Amendment (Constitution section 2), not an agent edit, and is on record in sessions.yaml (claude-code-session-ui2, 2026-08-13T20:37 - 2026-08-14T01:45).\n(2) F-9 \"Single operator, permanently\" — section 10 carries its own reconfirmation, not a reopening: \"F-9 explicitly reconfirmed, not reopened, 2026-08-14. The Pro Media v2 mockup ... shows 'presence' avatars, named comments, and a 'Team & permissions' screen. Asked directly, the operator confirmed these represent AI agents (Claude Code, Codex, up to the existing C-18 limit of 4 concurrent), not additional human users. F-9 is therefore unchanged.\" Checked against the actual code, not just the prose: promedia/core/principal.py defines PrincipalKind = Literal[\"operator\", \"agent\"] — there is no third kind, and no human-account/tenant model exists anywhere in promedia/ (grepped for tenant_id/organi[sz]ation/per-user roles: zero hits in promedia/core or promedia/web). App.vue's presence avatars are sourced from the C-19 lock table (locks.locks, keyed by agent), not from any human-user table — confirmed by reading the component directly. So \"ID-based multi-user access\" in this recommendation's own original reason was a conflation: what was authorised and built is ID-based multi-AGENT access (already governed by C-18's 4-concurrent limit), not a second human. C-17 (\"simultaneous humans: 1\") was never actually contradicted — it was misread against C-18 in the original framing.\n(3) C-13 (100 GB storage ceiling) — not contradicted by anything real. Grepped the shipped code: promedia/config.py still sets \"ceiling_bytes\": 107374182400  # 100 GB — C-13/F-7, and promedia/core/storage.py's reservation path (reserve(), CeilingExceeded) and promedia/core/acquire.py's pre-download admission check both still enforce it. Nothing in T-041..T-058 (the media/editor/rich-client work this recommendation was raised against) touches or relaxes this figure.\n(4) Retention policy / transient masters — unchanged in project.md section 10 and not contradicted by any shipped code path (no code anywhere converts a master to permanent storage).\nCONCLUSION: R-002 as raised on 2026-08-13 was accurate against the project.md of that date, but was resolved by a genuine Amendment the next day (DR-017, 2026-08-14) that this session has now independently verified — both in the document's own text and against the running code — rather than taking the amendment's self-description on faith. No part of the original concern (out-of-scope line, F-9, C-13, C-17) remains open. No further operator approval is needed to close this recommendation, because none of it involves changing project.md again — it is a record of confirming an amendment already made.\n"
      became_decision: "DR-017"
