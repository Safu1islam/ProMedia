    severity: "important"
    status: "pending"
  - id: "R-017"
    title: "T-051's Jinja2 clip editor has the same silent-lost-update window R-010 fixed in the Vue editor, and was never given the guard"
    raised_by: "claude-code-t049check-0816"
    raised_by_agent: "architect"
    during_task: "T-049CHECK"
    raised_at: "2026-08-16T00:50:00+04:00"
    recommendation: "Have promedia/web/app.py's project_edit_clips route (POST /projects/{project_id}/clips, T-051's structured clip editor) and the raw-JSON project_set_edl route (POST /projects/{project_id}/edl) both read the project's edl_version at page-render time, submit it as a hidden form field, and pass it through as set-edl's expected_version parameter — the same optimistic-concurrency guard T-055/R-010 already added to the Vue rich client's editor. set-edl's expected_version parameter already exists and is fully backward compatible (omitting it writes unconditionally), so this is additive on both the server and the two Jinja2 templates (project.html's JSON textarea form and its per-clip form), not a new operation.\n"
    reason: "Found while independently verifying T-050/T-051/T-052 for T-049CHECK (reconciling tasks.yaml against the RELEASED T-050..T-058 lock note and claude-code-session-ui2's sessions.yaml handoff, both of which claim T-050/051/052 landed with passing tests — confirmed true by direct execution, see that reconciliation). T-055's independent review (2026-08-14) found and fixed a silent lost-update bug in the Vue editor: it loads the whole EDL into a local array for the length of an editing session, then saves via set-edl with no expected-version check, so a concurrent writer's save gets silently reverted (C-18 allows up to 4 concurrent agent sessions; T-056 is explicitly about agents editing EDLs, so the contended case is designed-for). The fix (R-010) added an optional expected_version parameter to set-edl (promedia/core/projects.py:109, promedia/core/ops/projects.py:52) and wired ONLY EditorView.vue to send it. Read promedia/web/app.py lines 704-740 directly: project_set_edl and project_edit_clips (T-051, the structured per-clip form) both call `invoke(ctx, \"set-edl\", {...})` with no expected_version key at all — project_edit_clips even reads the current document first (line 727) and writes the edited version back (line 735), the exact same read-modify-write window the Vue editor had before the fix, just server-rendered instead of held in a browser tab. Because T-049/DR-004 keeps these Jinja2 pages as the permanent no-JS fallback (not a deprecated surface — see the T-049CHECK reconciliation in tasks.yaml), this is a live gap on a surface the project intends to keep operating, not dead-code debt.\n"
    expected_benefit: "Closes the identical silent-lost-update class on the surface DR-004 designates as the durable no-JS fallback, using a guard that already exists and is already proven (R-010's own tests). An operator or concurrent agent session editing a project's clips through the Jinja2 page can otherwise silently clobber another session's saved version with no warning, exactly as the pre-fix Vue editor could.\n"
    risk: "Low. expected_version is optional and backward compatible by design, so CLI callers and any agent that omits it keep writing unconditionally, unchanged. The main cost is two small template edits (a hidden version field) and reading the project's current version before rendering the edit forms, which project.html's route already does.\n"
    affected_components:
      - "promedia/web/app.py:project_set_edl"
      - "promedia/web/app.py:project_edit_clips"
      - "promedia/web/templates/project.html"
