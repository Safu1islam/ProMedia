  - id: "R-014"
    title: "restore() trusts artefact-supplied row keys as SQL column names, and integrity_hash authenticates self-consistency only"
    raised_by: "review-r003-0815"
    raised_by_agent: "reviewer-agent"
    during_task: "T-037"
    raised_at: "2026-08-15T00:00:00+04:00"
    recommendation: "In promedia/core/backup.py's restore(), validate every row's keys against the real column set of the target table (read from sqlite_master or a fixed per-table allowlist) before building the INSERT statement, and raise a ProMediaError naming the artefact and table rather than letting an unexpected key reach conn.execute() as a raw sqlite3.OperationalError. Separately, consider whether restore-permanent-set should require the artefact be one this installation (or a trusted peer) actually produced — e.g. an HMAC keyed from something outside the artefact itself — rather than only a hash the artefact's own author can freely compute to match.\n"
    reason: "Verified by execution during R-003's independent review of T-037: a crafted artefact with an injected non-column key in a payload row (`\"notreal, (SELECT sql FROM sqlite_master LIMIT 1)\": \"x\"` alongside real `accounts` columns) reached conn.execute() inside restore()'s transaction and raised sqlite3.OperationalError — an unhandled exception type, not a ProMediaError, and not caught by any existing validation. Python's sqlite3 .execute() refuses multiple statements per call (also confirmed by execution), so stacked-query injection is not reachable this way — but nothing stops a crafted artefact with CORRECT column names from inserting fully fabricated rows into permanent tables (a forged `approvals` row claiming operator approval, a forged `rights_verdicts` row claiming PERMITTED, a forged `provenance_records` row with a self-consistent `_integrity_hash`), because verify()'s integrity_hash is SHA-256 over the artefact's OWN payload — anyone who can produce JSON can compute a hash verify() accepts. tests/test_restore.py has no case for an artefact this build did not itself produce; every fixture is a trusted round-trip.\n"
    expected_benefit: "Closes an untested trust gap in the one path that reconstructs the permanent rights/provenance/audit record from an external file, before it is ever exercised by a real malformed or adversarial artefact.\n"
    risk: "Bounded today, not urgent: restore-permanent-set requires operator authority (F-2 — no agent can trigger it alone) and refuses onto any non-empty database (T-037 AC-4), so the realistic exposure is an operator deliberately restoring a file from an untrusted source onto a fresh install, not a live remote exploit against a populated database.\n"
    affected_components:
      - "promedia/core/backup.py"
      - "tests/test_restore.py"
    severity: "important"
    status: "pending"
  - id: "R-015"
    title: "delete_render leaks a phantom-available asset if the process dies mid-delete"
