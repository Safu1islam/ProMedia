      reason: "Fixed directly: delete-render registered in ops/projects.py exactly as recommended (entity='project', so it takes the C-19 lock via project_id like render-project and set-edl). delete_render() in projects.py gained an optional project_id parameter, cross-checked against the render's own project_id, so a mismatched pair is refused rather than silently deleted. Proven by execution through invoke(), not just by registration: a real ffmpeg render deleted end to end, a held project lock refusing the call, and a cross-project render_id being refused. tests/test_locking.py's pinned operation set and tests/test_ops_forms.py's GET-must-not-execute probe both required updates, which is the expected shape of adding a new mutating operation, not scope creep.\n"
