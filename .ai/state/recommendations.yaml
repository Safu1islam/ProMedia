    reason: "T-043's AC-3 (deleting a render returns its bytes to the ledger) is implemented and tested directly against the projects module, but ops/projects.py was outside T-043's claimed paths, so neither the CLI, the web UI, nor an agent via invoke() can call it today. F-1 requires every capability to be dual-surface; this one currently has zero."
