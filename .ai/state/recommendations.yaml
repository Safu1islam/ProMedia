  - id: "R-010"
    title: "T-055: silent lost update when an agent and the operator edit the same EDL"
    raised_by: "review-0814-ui2"
    raised_by_agent: "reviewer-agent"
    during_task: "T-055"
    raised_at: "2026-08-14T06:11:19+04:00"
    recommendation: "Add optimistic concurrency to set-edl: accept an expected_version parameter and refuse with a conflict when the stored current version differs. Have EditorView.vue send the edl_version it loaded, and surface a real conflict message plus the History table rather than overwriting. Optionally show the entity lock owner (api.ts already exposes the locks operation and the editor never calls it)."
    reason: "promedia/core/projects.py set_edl reads current_version and appends version+1 with no expected-version check. The registry entity lock is taken per call, so it protects the write but not the read-modify-write window. EditorView holds a full local clip array for the whole editing session, so the window is minutes wide. C-18 allows 4 concurrent agent sessions and T-056 is explicitly about agents editing EDLs, so contention is designed for. An agent saving v3 while the operator's tab holds v2 is silently reverted on the operator's next save. Append-only versioning means the work is recoverable from History, but nothing warns - and C-19 asks for a visible lock owner. Found during independent review 2026-08-14."
    affected_components:
      - "promedia/core/projects.py"
      - "promedia/web/frontend/src/views/EditorView.vue"
    severity: "important"
    status: "accepted"
    resolution:
      decided_by: "operator"
      decided_at: "2026-08-14T06:35:00+04:00"
      reason: "The required part done: set-edl takes an optional expected_version and refuses a stale write (ValidationError with expected_version/ current_version in detail), backward compatible for every caller that omits it. Covered by 3 new tests in tests/test_projects.py, all passing. The OPTIONAL suggestion (show the entity lock owner in the editor) was not built — recorded as still open, not silently dropped.\n"
      became_task: "T-061"
