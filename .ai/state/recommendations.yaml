  - id: "R-012"
    title: "Pro Media v2 client: latched offline badge, no unsaved-changes guard, invented timeline duration, table-row ARIA"
    raised_by: "review-0814-ui2"
    raised_by_agent: "reviewer-agent"
    during_task: "T-053"
    raised_at: "2026-08-14T06:11:35+04:00"
    recommendation: "Four independent frontend defects found in review, groupable into one cleanup task. (1) App.vue loadHeaderData never resets loadError, so one transient poll failure latches the header badge to 'offline' for the life of the tab. (2) EditorView has no onBeforeRouteLeave/beforeunload guard, so navigating away silently discards all unsaved clip edits. (3) EditorView timeline width uses (c.end ?? c.start + 5), inventing a 5-second duration for a clip with no out point - asset.duration_seconds is now real since A-15 retired. (4) role='button' on <tr> in five views removes rows from the table accessibility tree and orphans their cells; the top menu lacks aria-expanded/aria-haspopup and Escape-to-close."
