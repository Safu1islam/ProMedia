    raised_by_agent: "claude-code"
    during_task: "T-044"
    raised_at: "2026-08-15T16:21:41+04:00"
    recommendation: "Move the storage.free(ctx.conn, render_id) call in promedia/core/projects.py's delete_render into the SAME 'with transaction(ctx.conn):' block that already does DELETE FROM renders and UPDATE assets SET state='deleted'. storage.free() is a bare conn.execute with no BEGIN of its own (db.connect() runs isolation_level=None/autocommit), so today it commits immediately, before the following transaction opens."
    reason: "Independent review of T-044 (background agent, 2026-08-15) traced the sequence: path.unlink() -> storage.free() [commits immediately] -> separate transaction does DELETE FROM renders + UPDATE assets SET state='deleted'. If the process dies between those two steps, the ledger already shows the bytes freed but assets.state is still 'stored' with the file gone from disk. rights.media_state()/media_available() read only the DB state column, never touch disk, so a post queued against that asset id would pass the availability gate for media that no longer exists -- the same phantom-asset class T-029 fixed for ingested masters, reopened here for renders on a crash between these two statements."
    expected_benefit: "Closes a real, if narrow, crash-window bug in the same phantom-availability class the project has already paid to fix once (T-029). One-line fix (move a statement inside an existing transaction block)."
    risk: "None identified -- storage.free()'s UPDATE composes fine inside an outer BEGIN IMMEDIATE; this only narrows the commit window, it does not change behavior on the non-crash path."
    affected_components:
      - "promedia/core/projects.py:delete_render"
    severity: "important"
    status: "pending"
  - id: "R-016"
