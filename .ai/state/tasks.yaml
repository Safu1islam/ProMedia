    decisions: [DR-017]
    acceptance_criteria:
      - id: AC-1
        statement: "The timeline renders the current project's actual clips, in order, with real durations — not sample/placeholder data."
        result: PASSED
        evidence: >
          Verified live on the operator's real 'Launch teaser' project:
          timeline showed the actual 3 clips (fade/grayscale/saturate+
          dissolve effects) matching the real EDL, source monitor played
          the real screen recording via the new /media/{id}/file route
          (confirmed 206 Partial Content responses — real byte-range video
          serving, not a placeholder), program monitor played the real
          latest render via the existing /renders/{id}/file route.
      - id: AC-2
        statement: "Trimming, reordering, changing effect/transition, or deleting a clip calls set-edl and creates a new version, identically to T-051's form editor."
        result: PASSED
        evidence: >
          Full interactive round trip, not just code reading: clicked
          '+ Add clip', confirmed the 'unsaved changes' warning appeared,
          clicked 'Save as new version', confirmed via network tab that
          POST /api/op/set-edl returned 200, and confirmed the resulting
