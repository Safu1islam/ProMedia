      - id: AC-3
        statement: "A transition that does not render as named (F-003) is marked in this picker too, not only in the Jinja2 one."
        result: PASSED
        evidence: >
          Verified via page text extraction: the transition <select> lists
          all 7 values and correctly appends '— renders as fade from black'
          for dissolve and '— renders as hard cut' for each of wipeleft/
          wiperight/slideup/slidedown — matching capabilities.
          known_substitutions exactly, all 5 unimplemented transitions
