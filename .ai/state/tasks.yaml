    verification:
      - command: "python -m pytest -p no:cacheprovider"
        status: PASSED
        observed: "231 passed, 1 warning in 47.71s (218 before this task; +13 from tests/test_locking.py)"
      - command: "python -m pytest tests/test_parity.py tests/test_db.py -p no:cacheprovider"
        status: PASSED
        observed: "70 passed, 1 warning in 12.08s — the 62-case dual-surface gate and the 8 T-002 lock unit tests are unaffected"
      - command: "python -m pytest tests/test_locking.py -p no:cacheprovider, with the acquire branch in invoke() disabled (`if False and ...`)"
        status: FAILED
        observed: >
          Intentional sabotage, to prove the new tests can fail. 5 failed, 8 passed:
          test_lock_is_held_by_the_operation_layer_while_the_handler_runs,
          test_second_agent_is_refused_while_the_first_holds_the_entity,
          test_refusal_on_ownership_is_audited,
          test_nested_invoke_does_not_release_the_outer_lock,
          test_entity_locked_is_refused_identically_on_both_surfaces.
          Sabotage reverted; registry.py restored byte-identical (SHA-256
          E584E76B33FC73F46F6E929CA805861FE6F29A876FA7B9551CD4584E8CEBF5A0).
      - command: "python -m pytest tests/test_locking.py -p no:cacheprovider, with the release branch in the finally disabled"
        status: FAILED
        observed: >
          Second sabotage, covering the opposite bug — acquiring and never
          releasing. 5 failed, 8 passed, a different five: the three release
          tests plus test_same_agent_may_write_the_same_entity_repeatedly and
          test_nested_invoke_does_not_release_the_outer_lock. Actual text:
