      (fair use / fair dealing) — those still need legal input, which a
      confirmation does not supply.

  - id: OD-3
    question: "Is the per-asset attest-declaration step worth batching?"
    answer: "Keep it for now; revisit against real use, not theory."
    action_taken: "Recorded in DR-011 under operator_decision_2026_08_11."

  - id: OD-4
    question: "Supply X and LinkedIn credentials now?"
    answer: "Defer. The operator will run the credential commands directly when T-019 is actually needed."
    action_taken: >
      No change. T-019 stays blocked, fabrication F-001 stays active, and
      publishing stays simulated and disabled by default. Open item O-3 (API
      pricing against the $100/month ceiling) stays unanswered by design — it
      cannot be answered without live access, and must not be answered from
      model memory.

  - id: OD-7
    question: >
      Where should the off-site backup go? Options put to the operator:
      external/removable drive, an already-paid-for cloud drive, object storage
      (S3/B2/R2), or defer. At megabyte scale every option is effectively free,
      so this was framed as a trust decision rather than a cost one.
    answer: "For now we'll keep it here."
    decided: 2026-08-13
    action_taken: >
      T-038 (off-site destination and transport) stays blocked, now on an
      operator DECISION rather than on missing information. T-039 (scheduling)
      and T-040 (restore drill) stay blocked behind it. T-036 (export) and T-037
      (restore) are unaffected — both were deliberately planned to be
      destination-independent, which is why this deferral costs nothing already
      built.
    what_this_means: >
      STATED PLAINLY BECAUSE IT WOULD OTHERWISE READ AS DONE: keeping the
      artefact on this machine means the backup shares a disk with the thing it
      backs up. project.md 5.4 requires the permanent set to "survive disk
      loss", and a local copy does not — one disk failure takes both. What the
      local export DOES protect against is the more common failure: an
      accidental deletion, a bad migration, a corrupted database, or a mistake
      an operator wants to roll back. That is real and worth having.
      So the durability requirement in 5.4 is NOT met, and is not being treated
      as met. It is deferred, with the gap named here and in plan.yaml's
      known_omissions rather than allowed to disappear behind a green task.
    relevant_if: >
      Revisit when the publication history becomes hard to reconstruct, or
      before this stops being a single-operator tool. The cost of choosing later
      is unchanged — the artefact format is destination-independent, so adding a
      destination is additive work, not a rewrite. What grows with time is the
      amount of irreplaceable evidence at risk.

  - id: OD-5
    question: "Who performs the human-experience review?"
    answer: "The operator, on one real screen-recording workflow with simulation on."
    action_taken: >
      No change to code. This is the step that closes the review shortfall in
      OD-6; until it happens the shortfall stays recorded.

  - id: OD-6
