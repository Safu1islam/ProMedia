          confirmed in the live DOM that each clip row's asset <select> was
          bound to the correct asset id, so saving cannot silently reassign
          a clip to the wrong source.
        severity: OPTIONAL
        resolved: true
      - reviewer_role: reviewer
        finding: >
          INVENTED DURATION IN THE TIMELINE. Clip width is
          flexGrow = max((c.end ?? c.start + 5) - c.start, 1). When a clip
          has no out point (end === null — a legal EDL, and what "+ Add clip"
          itself creates: end: null) the timeline draws it as though it were
          exactly 5 SECONDS long. That number appears nowhere in the EDL, in
          the asset, or in any operation's response; it is a literal in the
          template. AC-1 claims the timeline shows "real durations", and for
          this case it does not — it shows a plausible-looking fabricated
          one, which Constitution section 6 treats as undisclosed debt rather
          than a cosmetic default. The honest source now exists: ffprobe
          populates asset.duration_seconds since A-15 was retired (AssetView
          already displays it). Either use it, or draw an explicitly
          indeterminate clip. NOTE: I could not measure the rendered widths —
          the browser pane reported window.innerWidth === 0, so all layout
          measurements were invalid and I am NOT claiming a visual defect,
          only the invented value in the source.
        severity: IMPORTANT
        resolved: true
        resolution: >
          FIXED (claude-code-fix-0814, 2026-08-14, R-012): a clip with no
          out point now uses asset.duration_seconds (real, ffprobe-sourced)
          minus the clip's start, via a new clipDuration() helper. The
          literal 5-second fallback only remains for the case where NEITHER
          end nor the asset's duration is known, and even then it no longer
          claims to be a duration — it is an unweighted minimum flex share.
          See promedia/web/frontend/src/views/EditorView.vue.
      - reviewer_role: reviewer
        finding: >
          UNHANDLED CONCURRENCY — SILENT LOST UPDATE. The editor loads the
          whole EDL into a local `clips` array and holds it for the length of
          an editing session, then saves { ...project.edl, clips } via
          set-edl. set-edl (promedia/core/projects.py:105) reads
          current_version and appends version+1 with NO expected-version
          check, and the registry's entity lock is taken per CALL, so it
          protects the write but not the read-modify-write window. C-18
          allows up to 4 concurrent agent sessions and T-056 is explicitly
          about agents editing EDLs, so the contended case is designed-for,
          not hypothetical: an agent saves v3 while the operator's tab still
          holds v2, and the operator's next save writes v4 from the stale v2
          content, silently reverting the agent's work. Nothing warns, and
          the editor never calls the `locks` operation it already has in
          api.ts. Not BLOCKING because versioning is append-only, so the lost
          work is still recoverable from History — but it is lost SILENTLY,
          and C-19 asks for a visible lock owner. The client already knows
          project.edl_version at load and could refuse or warn on mismatch;
          the durable fix is an expected_version parameter on set-edl.
        severity: IMPORTANT
        resolved: true
        resolution: >
          FIXED (claude-code-fix-0814, 2026-08-14, R-010): set-edl now takes
          an optional expected_version parameter (promedia/core/projects.py,
          promedia/core/ops/projects.py) and refuses with ValidationError
          (detail: expected_version, current_version) when it does not match
          the project's current version — the write is fully rejected, not
          partially applied. EditorView.vue sends project.edl_version it
          loaded from, and surfaces a specific conflict message pointing at
          History rather than the generic "could not save". Backward
          compatible: omitting expected_version writes unconditionally, so
          the CLI and every existing caller are unaffected. New tests:
          tests/test_projects.py
          (test_set_edl_with_a_stale_expected_version_is_refused_R010 and two
          adjacent success-path tests). The optional "show the lock owner"
          enhancement the recommendation also suggested was NOT done this
          pass — recorded as still open, not silently dropped.
      - reviewer_role: reviewer
        finding: >
          The new GET /media/{asset_id}/file route is sound and its stated
          security reasoning holds on inspection: the path comes from the
          database via the `asset` operation, never from the URL, so it
          cannot be walked; a non-'stored' asset is refused with
          MediaUnavailable rather than 404'd; a missing file on disk is a
          NotFound. Its three tests (success / refusal / unknown asset) were
          executed as part of the run below and passed. One property worth
          recording rather than flagging: like the pre-existing
          /renders/{id}/file, it resolves through an agent-authority read, so
          media bytes are readable by any local process that can reach the
          port without presenting the operator token. That matches the
          existing documented boundary (localhost is not an authentication
          boundary; the token gates AUTHORITY, not reads) and is not a
          regression introduced here.
        severity: OPTIONAL
        resolved: true
      - reviewer_role: human_experience_reviewer
        finding: >
          UNSAVED WORK IS DISCARDED WITHOUT WARNING ON NAVIGATION. `dirty` is
          computed correctly, but it is surfaced in exactly one place — an
          inline note in the render row ("Unsaved clip changes — save a
          version before rendering to include them"). There is no
          onBeforeRouteLeave guard and no beforeunload handler, so leaving
          the editor by any means (the top menu, a router-link, browser back,
          closing the tab) silently throws away every trim, reorder, effect
          and transition change made since load. This is the reviewer
          question "what happens when the user makes a mistake — is recovery
          possible without loss?" answered as: no, and without being told.
          A room whose entire purpose is accumulating edits before an
          explicit save needs a leave guard.
        severity: IMPORTANT
        resolved: true
        resolution: >
          FIXED (claude-code-fix-0814, 2026-08-14, R-012): onBeforeRouteLeave
          now prompts for confirmation when `dirty` is true before an
          in-app navigation away from the editor, and a beforeunload handler
          covers closing/reloading the tab. See
          promedia/web/frontend/src/views/EditorView.vue.
      - reviewer_role: human_experience_reviewer
        finding: >
          Minor, and noted because the room otherwise handles unavailable
          media carefully: "+ Add clip" always inserts assets[0] with no
          regard for state, so it can add a clip pointing at an asset whose
          media is 'deleted' or 'absent'. The clip row's <select> does label
          such assets with their state, and the source monitor then says
          "media not available", so it is discoverable — but the default
          insertion is the wrong one to make silently. Preferring the first
          'stored' asset would cost one predicate.
        severity: OPTIONAL
        resolved: false
    independent_review:
      status: PASSED
      note: >
        PASSED WITH FINDINGS. Independent review by session review-0814-ui2,
        2026-08-14. AC-1/AC-3/AC-4 re-verified live on an ISOLATED scratch DB
