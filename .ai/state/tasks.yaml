# .ai/state/tasks.yaml — ProMedia coordination substrate.
# Schema: aef/schemas/task.schema.yaml
#
# Classification (protocol 04 step 1, against aef/config/routing.yaml):
#   base class      : new_project            -> mode critical
#   also touches    : auth_or_permissions    -> mode critical
#                     data_model_change      -> mode critical
#   escalators      : touches secrets + auth -> force_mode critical
#                     fabrications introduced -> add dimension fabrication_replacement_plan
#   resulting mode  : critical (a class may be escalated, never downgraded)
#   consequences    : require_plan, require_architecture_review, require_threat_model,
#                     require_rollback_plan, require_human_approval, reviewers 3
#
# require_human_approval is satisfied at the pre_production checkpoint gate
# (.ai/config/overrides.yaml), NOT bypassed by the autonomous run authorisation.

meta:
  plan_version: 1
  planned_at: 2026-08-08
  planned_by_role: analyst
  mode: critical
  slice: "v1 vertical slice — connect account, ingest with rights metadata, rights
    determination, provenance, queue, approve, publish, record. Nothing else."
  contracts_frozen_before_dependents:
    - "Operation registry signature (DR-002) — T-003, frozen before T-006..T-013"
    - "Publisher interface (DR-010) — T-012, frozen before T-011"
    - "Rights verdict shape (DR-007) — T-009, frozen before T-010 and T-011"

tasks:

  - id: T-001
    title: Project scaffold, configuration, error taxonomy
    objective: >
      Establish the package skeleton and externalised configuration so that no
      later task hardcodes a threshold, path, or limit (protocol 05).
    change_class: new_project
    mode: critical
    owner_role: implementer
    assigned_model_tier: standard
    status: complete
    depends_on: []
    blocks: [T-002, T-003]
    owned_paths: [promedia/__init__.py, promedia/config.py, promedia/errors.py, promedia.toml, pyproject.toml]
    acceptance_criteria:
      - id: AC-1
        statement: "Loading config with no promedia.toml present yields documented defaults and does not raise."
        result: PASSED
        evidence: "tests/...::test_defaults_without_file — executed, observed pass"
      - id: AC-2
        statement: "A value set in promedia.toml overrides the default of the same name at runtime, not build time."
        result: PASSED
        evidence: "tests/...::test_file_overrides_default — executed, observed pass"
      - id: AC-3
        statement: "Storage ceiling, thresholds, derivative multiplier and publish tolerance are all readable from config, with no literal copy elsewhere in the package."
        result: PASSED
        evidence: "tests/...::test_no_hardcoded_thresholds — executed, observed pass"
    required_dimensions: [correctness, maintainability, documentation, testing]

  - id: T-002
    title: SQLite layer — schema, pragmas, migrations, entity locks
    objective: >
      Provide the transactional substrate per DR-003, including the application-level
      entity lock table that implements C-19 with a visible owner.
    change_class: data_model_change
    mode: critical
    owner_role: implementer
    assigned_model_tier: standard
    status: complete
    depends_on: [T-001]
    blocks: [T-003, T-007, T-013]
    owned_paths: [promedia/core/db.py, promedia/core/schema.sql]
    acceptance_criteria:
      - id: AC-1
        statement: "A fresh database applies the schema and reports schema_version 1."
        result: PASSED
        evidence: "tests/...::test_fresh_database_applies_schema — executed, observed pass"
      - id: AC-2
        statement: "foreign_keys, WAL journal mode and busy_timeout are all active on every connection."
        result: PASSED
        evidence: "tests/...::test_pragmas_active — executed, observed pass"
      - id: AC-3
        statement: "Acquiring a lock on an entity already locked by a different agent raises EntityLocked and names the current owner."
        result: PASSED
        evidence: "tests/...::test_second_agent_cannot_lock_owned_entity — executed, observed pass"
      - id: AC-4
        statement: "An expired lock can be reclaimed by a different agent; a live one cannot."
        result: PASSED
        evidence: "tests/...::test_expired_lock_reclaimable — executed, observed pass"
      - id: AC-5
        statement: "Deleting an asset row leaves its provenance record intact and readable."
        result: PASSED
        evidence: "tests/...::test_provenance_survives_asset_deletion — executed, observed pass"
    required_dimensions: [correctness, data_integrity, migration_safety, rollback, backup_recovery, documentation, testing]

  - id: T-003
    title: Operation registry and authority model
    objective: >
      Implement DR-002's single source of truth. One implementation per capability,
      with the F-2 authority ceiling attached to the operation definition so both
      surfaces enforce it identically.
    change_class: auth_or_permissions
    mode: critical
    owner_role: implementer
    assigned_model_tier: frontier
    status: complete
    depends_on: [T-001, T-002]
    blocks: [T-004, T-005, T-006, T-008, T-009, T-011]
    owned_paths: [promedia/core/registry.py, promedia/core/principal.py]
    acceptance_criteria:
      - id: AC-1
        statement: "Registering two operations with the same name raises at import time rather than silently overwriting."
        result: PASSED
        evidence: "tests/...::test_duplicate_registration_rejected — executed, observed pass"
      - id: AC-2
        statement: "Invoking an authority=operator operation as an agent principal returns FORBIDDEN and performs no side effect."
        result: PASSED
        evidence: "tests/...::test_agent_denied_operator_operation — executed, observed pass"
      - id: AC-3
        statement: "Authority is enforced inside the operation layer, so the same call denied on the CLI is denied identically over HTTP."
        result: PASSED
        evidence: "tests/...::test_authority_identical_across_surfaces — executed, observed pass"
      - id: AC-4
