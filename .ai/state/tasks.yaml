        result: PASSED
        evidence: "tests/...::test_fresh_database_applies_schema — executed, observed pass"
      - id: AC-2
        statement: "foreign_keys, WAL journal mode and busy_timeout are all active on every connection."
        result: PASSED
        evidence: "tests/...::test_pragmas_active — executed, observed pass"
      - id: AC-3
