# .ai/state/tasks.yaml — ProMedia coordination substrate.
# Schema: aef/schemas/task.schema.yaml
#
# Classification (protocol 04 step 1, against aef/config/routing.yaml):
#   base class      : new_project            -> mode critical
#   also touches    : auth_or_permissions    -> mode critical
#                     data_model_change      -> mode critical
#   escalators      : touches secrets + auth -> force_mode critical
#                     fabrications introduced -> add dimension fabrication_replacement_plan
#   resulting mode  : critical (a class may be escalated, never downgraded)
#   consequences    : require_plan, require_architecture_review, require_threat_model,
#                     require_rollback_plan, require_human_approval, reviewers 3
#
# require_human_approval is satisfied at the pre_production checkpoint gate
# (.ai/config/overrides.yaml), NOT bypassed by the autonomous run authorisation.

meta:
  plan_version: 1
  planned_at: 2026-08-08
  planned_by_role: analyst
  mode: critical
  slice: "v1 vertical slice — connect account, ingest with rights metadata, rights
    determination, provenance, queue, approve, publish, record. Nothing else."
  contracts_frozen_before_dependents:
    - "Operation registry signature (DR-002) — T-003, frozen before T-006..T-013"
    - "Publisher interface (DR-010) — T-012, frozen before T-011"
    - "Rights verdict shape (DR-007) — T-009, frozen before T-010 and T-011"

tasks:

  - id: T-001
    title: Project scaffold, configuration, error taxonomy
    objective: >
      Establish the package skeleton and externalised configuration so that no
      later task hardcodes a threshold, path, or limit (protocol 05).
    change_class: new_project
    mode: critical
    owner_role: implementer
    assigned_model_tier: standard
    status: complete
    depends_on: []
    blocks: [T-002, T-003]
    owned_paths: [promedia/__init__.py, promedia/config.py, promedia/errors.py, promedia.toml, pyproject.toml]
    acceptance_criteria:
      - id: AC-1
        statement: "Loading config with no promedia.toml present yields documented defaults and does not raise."
        result: PASSED
        evidence: "tests/...::test_defaults_without_file — executed, observed pass"
      - id: AC-2
        statement: "A value set in promedia.toml overrides the default of the same name at runtime, not build time."
        result: PASSED
        evidence: "tests/...::test_file_overrides_default — executed, observed pass"
      - id: AC-3
        statement: "Storage ceiling, thresholds, derivative multiplier and publish tolerance are all readable from config, with no literal copy elsewhere in the package."
        result: PASSED
        evidence: "tests/...::test_no_hardcoded_thresholds — executed, observed pass"
    required_dimensions: [correctness, maintainability, documentation, testing]

