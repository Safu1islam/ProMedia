  - id: OD-9
    question: >
      T-038 revisited (2026-08-17): OD-7 (2026-08-13) had deferred the
      off-site destination with "for now we'll keep it here." Asked again,
      with the same four options T-038's objective puts to the operator —
      external/removable drive, a consumer cloud drive already paid for,
      object storage (S3/B2/R2), or defer again.
    answer: "External/removable drive."
    decided: 2026-08-17
    action_taken: >
      OD-7's deferral is superseded for T-038 specifically; it stays true as
      history of why the task sat blocked from 2026-08-13 to 2026-08-17.
      Implemented `send-offsite` (promedia/core/ops/backup.py, T-038):
      copies a fresh permanent-set artefact to an operator-supplied
      destination directory, verifies the COPY's integrity hash after
      writing (not just the source), and appends a durable
      what/when/hash manifest at the destination itself so the drive is
      self-describing independent of this machine's database. Operator
      authority, same gate as export-permanent-set. Not encrypted — AC-2's
