    verification:
      - command: "python -m pytest -p no:cacheprovider  (baseline, before any edit)"
        status: PASSED
        observed: "236 passed, 0 failures, 55.6s"
      - command: "python -m pytest -p no:cacheprovider  (after the api_op refactor, before any new test)"
        status: PASSED
        observed: >
          236 passed. Run deliberately at this point: _token_in_query and
