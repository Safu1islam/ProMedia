  - id: T-035
    title: "The generic /ops form can approve and publish without showing the decision context first"
    objective: >
      Raised by independent review of T-034, 2026-08-12. /ops/{name} renders a
      submittable form for every operation including approve-post and
      publish-post, so the operator can authorise on a typed post_id. The
      verdict, ruleset version and asset hash appear in the response, after the
      decision. /posts/{id} exists because those facts belong BEFORE the
      control.
      Every hard gate holds — rights 403, authority 403, locking, masked
      secrets, all verified — so this is a human-experience defect, not a
      security one. It is exactly the class of thing project.md flags as
      requiring a human-experience reviewer rather than a code reviewer.
      Options, for the operator to choose between: (a) the generic form refuses
      approve-post/publish-post and links to /posts/{id}; (b) it renders the
      decision context inline before the control; (c) accept it as-is and
      record why.
    change_class: ui_change
    mode: standard
    status: complete
    claimed_by: "claude-code-session-next3"
    owned_paths: [promedia/web/app.py, promedia/web/templates/op.html, tests/test_decision_context.py, tests/test_ops_forms.py, tests/test_surface_signals.py]
    found_by: "independent review of T-034"
    option_chosen:
      chosen: "(b) render the decision context inline before the control"
      as_a_two_step: >
        (b) cannot be a single render: the form starts empty, so there is no
        post_id to fetch a context for until something is submitted. The
        submission therefore shows the basis and executes NOTHING; a second,
        deliberate confirmation runs the operation.
      why_not_a: >
        Refusing approve-post/publish-post on /ops and linking to /posts/{id}
        would take back part of what T-034 delivered — the operator asked for a
        browser-operable surface, and a capability that redirects is not
        operable. It also leaves the /ops form as the screen that ALMOST works.
      why_not_c: >
        Accepting it would leave F-2's authority surface authorising on a typed
        id. The UI is the authority surface BECAUSE it shows the basis; without
        that it is the CLI with a browser skin, which is the reviewer's phrasing
        and is correct.
      operator_may_downgrade: >
        This is the strongest of the three options and preserves capability. If
        the operator prefers (a) or (c), the change is small and this record is
        the argument to weigh against.
    acceptance_criteria:
      - id: AC-1
        statement: "Approving or publishing from a browser is impossible without the decision context having been displayed first, or the decision to allow it is recorded with its reasoning."
        result: PASSED
        evidence: >
          A POST to /ops/{approve-post,publish-post,release-publish-claim}
          carrying a post_id renders the decision context and executes nothing;
          only a submission carrying a confirmation matching that context runs.
          test_approve_does_not_execute_on_the_first_submission asserts the post
          is still 'queued' after the first POST; test_publish_is_gated_too
          asserts publications == 0. tests/test_decision_context.py — 13 tests,
          executed, observed pass. Full suite 359 passed.
      - id: AC-2
        statement: "The facts shown are the ones T-005 AC-1 requires of the approval surface: target account, rights verdict, ruleset version, asset hash."
        result: PASSED
        evidence: >
          test_the_first_response_carries_the_facts_t005_requires looks each value
          up through the 'post' operation and then requires it to appear on the
          page, so a template that drops a row fails rather than passing on a
          plausible-looking screen. The context is fetched THROUGH invoke(), not
          read from the database in the adapter, so this screen and /posts/{id}
          cannot show different facts about the same post.
      - id: AC-3
        statement: "The confirmation is bound to the facts displayed, not a bare acknowledgement."
        result: PASSED
        evidence: >
          The confirmation carries a SHA-256 over the canonical JSON of the
          decision context. If the basis changes between display and
          confirmation, the digest no longer matches and the operator is re-shown
          the current facts instead of authorising ones that stopped being true.
          test_a_confirmation_goes_stale_when_the_basis_changes covers it, and it
          was also driven end to end against a live server: verdict PERMITTED at
          display, degraded to ESCALATE by new model evidence, stale confirmation
          submitted — post stayed 'queued'.
      - id: AC-4
        statement: "The requirement does not over-apply, and the other surfaces are unchanged."
        result: PASSED
        evidence: >
          A confirmation on everything is a confirmation nobody reads, so this is
          asserted in both directions. test_ordinary_operations_are_not_gated and
          test_ingest_still_runs_in_one_submission pin that non-post operations
          still complete in one submission. test_the_api_route_is_unchanged pins
          that /api/op/approve-post still executes directly — the confirmation is
          a projection detail of one HTML route, NOT an operation-layer rule.
          Had it been enforced in invoke() it would have become a capability the
          CLI could not perform, and the parity gate would have been right to
          fail. Parity stayed at 62 cases.
    verification:
      - command: "python -m pytest -p no:cacheprovider"
        status: PASSED
        observed: "359 passed (346 before this task, +13 from tests/test_decision_context.py)"
      - command: "python -m pytest -p no:cacheprovider tests/test_parity.py"
        status: PASSED
        observed: "62 passed — unchanged; this task adds a step to one HTML route, not an operation"
      - command: "python -m pytest -p no:cacheprovider tests/test_decision_context.py, with the confirmation branch disabled (`if False and _needs_decision_context(op)`)"
        status: FAILED
        observed: >
          6 failures, including the two that ARE the defect —
          test_approve_does_not_execute_on_the_first_submission (the post was
          approved on a typed id, no context ever shown) and
          test_publish_is_gated_too. Reverted; app.py SHA-256
          7a1b2b9fee0f8087af0c0dee50af8b27c1699cc4b1ee4c46720ea07512f0a7a3.
      - command: "python -m pytest -p no:cacheprovider tests/test_decision_context.py, with _decision_digest returning a constant"
        status: FAILED
        observed: >
          Second sabotage, at the subtle point: the plausible weaker design is a
