    status: complete
    claimed_by: "claude-code-session-ui2"
    depends_on: [T-053]
    blocks: []
    owned_paths: [promedia/web/frontend/**, promedia/web/app.py, tests/test_frontend_api.py]
    owned_paths_note: >
      promedia/web/app.py gained ONE new route, GET /media/{asset_id}/file —
      needed for the source monitor's real preview. Same shape and same
