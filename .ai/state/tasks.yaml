  - id: T-027
    title: "C-19 entity locking is reachable from neither surface (I7)"
    objective: "acquire_lock/release_lock are implemented and unit-tested but called by no operation, so C-19 is unenforced with up to 4 concurrent agents. The mirror image of an F-1 defect: a capability on zero surfaces, which the parity test cannot see."
    change_class: api_change
    mode: standard
    status: complete
    claimed_by: "claude-code-session-38b1e8a2"
    owned_paths: [promedia/core/registry.py, tests/test_locking.py]
    owned_paths_note: >
      promedia/core/ops/system.py was listed at planning time but needed no
