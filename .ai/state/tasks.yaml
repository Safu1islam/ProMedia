    decisions: [DR-003, DR-006, DR-008]
    design_finding_before_implementation:
      found: 2026-08-13
      found_by: "T-036 implementer, reading the restore path before starting it"
      summary: >
        RESTORE NEEDS A THIRD ASSET STATE, AND THEREFORE A SCHEMA MIGRATION.
        Recorded before implementation so the next session does not rediscover
        it halfway through and improvise.
      detail: >
        Media availability is decided by `assets.state == 'stored'`
        (posts.py decision_context and the approve/publish gates), NOT by
        checking that the object exists on disk. Media is transient and is
        deliberately not in the artefact, so a restored asset row would say
        'stored' while nothing is on disk — a phantom asset walking straight
        through the rights gate, which is precisely the defect T-029 closed.
        Neither existing value is honest for a restored row:
          * 'stored'  — claims media is present. False, and dangerous: approve
            and publish would offer controls over nothing.
          * 'deleted' — means RETENTION destroyed it, which T-029 makes final:
            re-ingest is permanently refused, and publishing to a new platform
            is out of scope by policy. Marking a restored asset 'deleted' would
            wrongly foreclose re-ingesting media the operator still has, turning
            a recovery into an irreversible loss of capability.
        The honest shape is a third state — 'absent' (the record is restored,
        the media is not here, re-ingest is ALLOWED) — which means widening the
        CHECK constraint on assets.state. SQLite cannot ALTER a CHECK, so this
        is a table migration and a data_model_change under DR-003, not an
        incidental edit.
      consequence_for_this_task: >
        T-037 is larger than "read the artefact back". It carries a schema
        migration, a decision about what a restored-but-absent asset may do, and
        the re-ingest path that makes recovery of media possible. It should be
        started fresh rather than tacked onto a long session.
      not_yet_decided:
        - "Whether a restored 'absent' asset keeps its old verdict as governing, or must be re-determined once its media is re-ingested (C-20 says a verdict is a fact about a rights position, which argues for keeping it)."
        - "Whether re-ingesting the bytes of an 'absent' asset returns it to 'stored' on the same asset id, or creates a new one."
    required_dimensions: [correctness, data_integrity, rollback, backup_recovery, error_handling, testing, documentation]
    review:
      - reviewer: "review-r003-0815"
        role: reviewer-agent
        at: "2026-08-15T00:00:00+04:00"
        summary: >
          RECORD CLEANUP, disclosed rather than silently done: this task
          record carried a stale pre-implementation stub below its real
          results — a second `owned_paths:` (3 paths, silently shadowing the
          real 10-path list under PyYAML's last-key-wins, which would have
          under-reported this task's true footprint to any tool reading the
          field) and a second, non-canonical `acceptance_criteria_results:`
          block sitting ALONGSIDE a canonical `acceptance_criteria:` block
          that still read NOT_RUN/"not implemented" for all four ACs —
          aef/schemas/task.schema.yaml names `acceptance_criteria`, not
          `_results`, so any schema-honest reader would have seen this
          complete, PASSED task as 0% verified. Merged into one canonical
          `acceptance_criteria:` block carrying the real PASSED evidence, and
          the duplicate `owned_paths:` removed. No evidence content was
          changed, only de-duplicated.

          SUBSTANTIVE FINDING: restore() (promedia/core/backup.py) builds its
          INSERT statement's column list directly from the artefact
          payload's own dict keys (`columns = ", ".join(row)`), with no
          check that those keys are real columns of the target table. Traced
          together with T-036's integrity_hash, which is SHA-256 over the
          artefact's OWN payload — a self-consistency checksum, not a
          signature: anyone who can produce a JSON file can compute a hash
          that verify() accepts, so "integrity verified" means "internally
          consistent", not "produced by this system's own export". Verified
          by execution, not by reading: a crafted artefact with an injected
          non-column key in a row (`"notreal, (SELECT sql FROM
          sqlite_master LIMIT 1)": "x"`) reaches conn.execute() and raises a
          raw sqlite3.OperationalError — an unhandled exception type, not a
          ProMediaError — rather than being rejected by validation. Stacked
          multi-statement injection is not reachable this way (Python's
          sqlite3 .execute() refuses more than one statement, confirmed by
          the same test), so the practical exposure is: (a) a crash/DoS
          inside the restore transaction rather than a clean refusal, and
          (b) more importantly, nothing stops a crafted artefact with
          CORRECT column names from inserting fabricated rows into
          permanent tables — a forged `approvals` row claiming operator
          approval, a forged `rights_verdicts` row claiming PERMITTED, or a
          forged `provenance_records` row with a self-consistent
          `_integrity_hash` — all of which pass verify() and restore()
          identically to genuine ones. tests/test_restore.py has no case for
          an artefact this build did not itself produce; every fixture is a
          trusted round-trip. Blast radius is bounded by two existing
          controls neither test nor code comment currently states as
          mitigating THIS risk: restore-permanent-set requires operator
          authority (F-2 — no agent can trigger it alone) and refuses onto
          any non-empty database (so it cannot corrupt a live populated
          install, only a fresh/empty one). Raised as R-014 rather than
          fixed here — a reviewer records, it does not fix, and the row-key
          validation plus the OperationalError-to-ProMediaError translation
          both touch promedia/core/backup.py, which this session does not
          own.
