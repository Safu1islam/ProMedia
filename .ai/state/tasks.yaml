  - id: T-029
    title: "Re-ingesting a retention-deleted asset reports success and restores nothing (I9)"
    objective: "The duplicate branch matches on content_hash without consulting state, so re-ingest of a deleted asset returns duplicate:true while the row stays deleted with no object_path and the reservation is released."
    change_class: data_model_change
    mode: standard
    status: complete
    owned_paths: [promedia/core/ingest.py]
    acceptance_criteria:
      - id: AC-1
        statement: "Re-ingesting a file whose asset row is state='deleted' restores the object and re-commits storage, or fails loudly."
        result: PASSED
        evidence: "tests/test_phantom_asset.py — 11 tests, executed, observed pass"

    decision_restore_vs_refuse:
      chosen: REFUSE
      implementer_reasoning: >
        Deduplication is a claim that the media is already here. For a deleted
        asset that claim is false, and a false ok=True is worse than a refusal.
      reviewer_note: >
        I had argued restoration was the more useful option when briefing this.
        The implementer chose refusal and made the better case: restoring would
        silently resurrect media the retention policy deliberately destroyed,
        and F-7's whole point is that deletion is final. Accepted.
    phantom_verdict_line:
      still_works: >
        Reading rights facts. `rights` reports verdict=PERMITTED alongside
        media_state=deleted and publishable=False; determine-rights still
        evaluates; the sealed provenance record is readable and its integrity
        verifies. F-8 and C-20 require exactly this — the verdict is a fact
        about a rights position, and it does not stop being true because the
        bytes were deleted.
      now_refuses: >
        Acting on absent media. approve-post and publish-post raise
        MediaUnavailable, and decision_context reports approvable=false and
        media_available=false so no surface offers a control the server will
        refuse.
      why_a_new_error: >
        MediaUnavailable is deliberately neither RightsBlocked nor NotFound.
        Reporting an availability problem as a rights problem would send the
        operator to repair a rights record that has nothing wrong with it.
