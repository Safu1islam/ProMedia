      - command: "python -m pytest -p no:cacheprovider"
        status: PASSED
        observed: "298 passed, 0 failures, 65.3s (236 before, +62 from tests/test_ops_forms.py)"
      - command: "python -m pytest -p no:cacheprovider tests/test_parity.py tests/test_hardening.py"
        status: PASSED
        observed: >
          96 passed — 62 parity + 34 hardening, both counts unchanged from before
          this task. Neither file was claimed or edited, which is what makes the
          numbers comparable: this task added routes, not operations.
      - command: "python -m pytest -p no:cacheprovider tests/test_ops_forms.py  (SABOTAGE 1: op_form runs the operation from its query parameters)"
        status: FAILED
        observed: >
          THE IMPORTANT ONE. First run: 1 failure only —
          test_get_of_the_form_writes_no_audit_entry. The parametrised
          state-comparison test PASSED under a GET that really did execute,
          because it probed with the literal 'probe' for every id and validation
          refused the call before any side effect. The test was asserting that
          bad input does nothing, not that GET does nothing.
          Rewritten to seed a real account/asset/post and probe with parameters
          that would SUCCEED. Re-run under the same sabotage: 13 failures, one
          per mutating operation plus the audit test, including
          [publish-post] — i.e. the unfixed version would have let a prefetcher
          or a pasted link publish. Sabotage reverted; promedia/web/app.py
          SHA-256 verified back to 8F2D47115DA899C106D856B2BC2CA4A770DB85F3A2E1ECFEB3C29E06F2B3E6F9.
      - command: "python -m pytest -p no:cacheprovider tests/test_ops_forms.py  (SABOTAGE 2: render_op repopulates sensitive fields, template gains value=)"
        status: FAILED
        observed: >
          1 failure, test_a_submitted_secret_is_not_echoed_back_into_the_form.
          Two files had to be sabotaged together (app.py and op.html) because the
          leak needs both halves, which is the point of stripping in render_op
          rather than relying on the template. Both reverted from a scratchpad
          copy and SHA-256 verified (app.py 8F2D4711..., op.html
          A3C67DA6F655D1376A0194874C116CA31DA42F23FA7EE595A3451B86D996C837).
      - command: "python -m pytest -p no:cacheprovider tests/test_ops_forms.py  (SABOTAGE 3: op_submit calls run() instead of guarded(), op_page_refusal dropped)"
        status: FAILED
        observed: >
          3 failures: cross-origin POST returned 200 instead of 403 (T-025 gone),
          ?secret= returned 200 instead of 400 (T-024 gone), and ?token= was
          accepted and used (404 from the operation itself, not 400 from the
          guard — N9 gone). Sabotage reverted and hash-verified.
      - command: "Real browser (Chromium), server on 127.0.0.1:8766"
        status: PASSED
        observed: >
          NOT_RUN in every prior task on this surface — T-031's review recorded
          'Real browser behaviour. Everything is TestClient'. Here: /ops/{name}
          rendered for connect-account and storage-status; the agent-authority
          notice appeared; submitting storage-status produced a genuine
          cross-origin-checked POST with a real Origin header and rendered the
          JSON result. GET /ops/connect-account?secret=canary rendered the
          VALIDATION page. Confirms the T-025 origin baseline works against a
          real browser and not only TestClient.
          Only read-only operations were exercised — the instance was pointed at
