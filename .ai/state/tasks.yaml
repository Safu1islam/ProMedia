  - id: T-033
    title: "connect-account reconnect is an unlocked write to an existing account"
    objective: >
      Raised by the T-027 implementer. Since T-023, connect-account preserves the
      account id when platform+handle already match, so a credential rotation
      mutates an existing entity — but the operation declares no account_id
      parameter, so lock_target() returns None and no lock is taken. Its natural
      key is platform:handle, which is not an entity id, so locking it needs a
      different mechanism rather than an invented id.
      Low impact today: operator authority, and C-17 fixes humans at 1.
    change_class: auth_or_permissions
    mode: standard
    status: complete
    claimed_by: "claude-code-session-next3"
    owned_paths: [promedia/core/registry.py, promedia/core/ops/accounts.py, tests/test_account_locking.py, tests/test_locking.py]
    owned_paths_note: >
      tests/test_locking.py was added to the claim during the run. It PINNED
      connect-account in CREATING_OPERATIONS with the comment "there is no id to
      lock because the entity does not exist yet" — a claim this task makes
      false. Leaving a stale assertion in place to keep a case count comparable
      is how N5 happened, so it was claimed and corrected instead.
    found_by: "implementer agent during T-027"
    acceptance_criteria:
      - id: AC-1
        statement: "A reconnect of an existing account takes an exclusive lock on that account, and a second agent attempting it concurrently is refused with ENTITY_LOCKED."
        result: PASSED
        evidence: >
          Operation gained a declarative natural key (lock_by=("platform","handle"))
          and lock_target() gained a second branch that composes the lock id from
          it, prefixed "key:" so it cannot collide with a generated acct_ id in
          the shared entity_locks table. agent-beta attempting the same account
          from inside agent-alpha's handler is refused with ENTITY_LOCKED,
          detail.owner == "agent-alpha", detail.entity_id == "key:x:acme".
          tests/test_account_locking.py — 13 tests, executed, observed pass.
          Full suite 335 passed (322 before, +13).
      - id: AC-2
        statement: "The lock key normalises identically to the handler, so two spellings of one account cannot take two locks."
        result: PASSED
        evidence: >
          Not in the original brief; found while writing the tests and treated as
          part of AC-1 rather than deferred, because a lock key that disagrees
          with the handler's own lookup key is locking that appears present and
          excludes nothing. lock_target strips and lowercases each part, matching
          connect_account's own normalisation (N13).
          test_the_key_normalises_exactly_as_the_handler_does and
          test_the_contended_account_is_the_one_named_in_the_refusal (which has
          beta contend with "ACME" against alpha's "acme").
    verification:
      - command: "python -m pytest -p no:cacheprovider tests/test_account_locking.py tests/test_locking.py"
        status: PASSED
        observed: "26 passed (13 new + 13 existing lock tests, the latter unchanged in count)"
      - command: "python -m pytest -p no:cacheprovider tests/test_parity.py tests/test_hardening.py"
        status: PASSED
        observed: "96 passed — 62 parity + 34 hardening, both unchanged; this task adds a lock, not an operation"
      - command: "python -m pytest -p no:cacheprovider, with the lock_by branch in lock_target disabled (`if False and op.lock_by`)"
        status: FAILED
        observed: >
          Intentional sabotage, to prove the new tests can fail. 9 failures
          including the behavioural ones — test_a_second_agent_is_refused_mid_reconnect,
          test_the_contended_account_is_the_one_named_in_the_refusal,
          test_a_first_time_connect_also_locks — plus the two structural pins in
          tests/test_locking.py. Reverted; registry.py SHA-256 verified
          e36757acd0577b2e7b14b6d450fab73fbf39741a185181085c42430d928a4e7b.
      - command: "python -m pytest -p no:cacheprovider tests/test_account_locking.py, with `parts.append(value.strip().lower())` weakened to `parts.append(value)`"
        status: FAILED
        observed: >
          Second sabotage, at the subtle point rather than the obvious one. THE
          IMPORTANT RESULT: test_the_contended_account_is_the_one_named_in_the_refusal
          failed with a real sqlite3.IntegrityError surfacing as
          "operation 'connect-account' failed unexpectedly (IntegrityError)" —
          i.e. two spellings escaped the lock and BOTH wrote the same
          UNIQUE(platform, handle) row. That is the data-corruption failure mode
          itself, not an assertion mismatch. Reverted and hash-verified.
    fabrications_introduced: []
    assumptions:
      - >
        Over-locking is the safe direction where handler and key normalisation
        cannot be proven to agree. A spurious ENTITY_LOCKED is transient and
        retryable (DR-012 exit 4 / HTTP 409); under-locking is a concurrent write
        to one row. Stated in lock_target's docstring rather than left implicit.
    open_items:
      - >
        Natural-key locks and id locks on the same entity type are different
        rows in entity_locks and therefore do NOT exclude each other. No
        operation locks an account by id today, so only one mechanism is in use
        and the gap is currently unreachable. Rather than leave that to be
        discovered, test_no_operation_locks_accounts_by_id_while_this_one_locks_by_key
