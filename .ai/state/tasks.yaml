        - "No sabotage leftovers: grep for 'if False' / disabled-guard markers across the package found nothing — PASSED"
        - "Full suite re-run independently: 231 passed — PASSED"
        - >
          MY OWN check, deliberately different from the implementer's per-test
          assertions: drove a real 8-operation end-to-end slice (connect, ingest,
          attest, determine, seal, queue, approve, publish) and then asserted the
