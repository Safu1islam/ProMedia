          /ops/connect-account?secret=canary rendered the VALIDATION page.
      - id: AC-5
        statement: "The operator token is refused in the query string on these routes, as it is on /api/op/{name} (N9)."
        result: PASSED
        evidence: >
          ::test_operator_token_is_refused_in_the_query_string presents a VALID
          token on both GET and POST and asserts 400 plus an empty audit log, so
