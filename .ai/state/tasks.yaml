    findings:
      - >
        AC-4 WAS TOO NARROW WHEN WRITTEN, and an independent audit (session
        audit-0813) caught it. Fabrication F-003 named 'dissolve' alone; the EDL
        actually advertises SEVEN transitions and the renderer implements THREE.
        wipeleft, wiperight, slideup and slidedown emit NO FILTER AT ALL and
        render as hard cuts while the render reports success — arguably worse
        than dissolve, which at least produces a visible effect.
        Verified independently before acting on it, by executing _clip_chain
        over all seven values rather than reading the code.
        The deeper defect was the shape: the reporting was a hand-written list
        in projects.py, separate from the filters it described, so it drifted
        from them immediately. Now derived from render.TRANSITION_REALITY, which
        sits next to the code that emits the filters, and
        test_every_advertised_transition_is_either_implemented_or_reported
        asserts the two sets match as a RULE over the vocabulary rather than a
        list of known-bad names.
      - >
        T-036's classify_tables() refused the three new tables, exactly as
        designed. It was written for "a table added years from now that silently
        falls out of every backup"; it caught one added hours later, as 50
        failing tests. projects and project_edl_versions are classified
        PERMANENT — an EDL is the operator's actual creative work, irreplaceable
        and kilobytes. `renders` is TRANSIENT: it records output files that are
        themselves not backed up and are reproducible from the EDL version plus
        its sources, so restoring those rows would assert renders whose files do
        not exist — the phantom problem T-029 closed for assets, one table over.
      - >
        conftest's media_file fixture writes placeholder bytes, which is correct
        for ingest and rights tests that never decode it. A render does, so
        test_projects.py generates real media with ffmpeg instead. Worth
        recording because the failure looked like a render bug and was a fixture
        assumption.
    fabrications_introduced: []
    fabrications_affected: [F-003]
    assumptions:
      - >
        Rendering is AGENT authority. Producing a file is drafting, not
        publishing — it does not reach a platform, spend money, or clear a
        rights flag, so F-2's ceiling is not touched. The operator gate stays
        where it already is: approval and publication.
    open_items:
      - >
        RENDERS ARE NOT COUNTED AGAINST THE STORAGE CEILING. Every render writes
        bytes the ledger knows nothing about, and DR-006 makes the ledger the
        sole source of truth for F-7. The render result says so in a
        storage_note field rather than staying quiet, but that is disclosure,
        not enforcement. T-043.
      - >
        NO RIGHTS CHECK PRECEDES A RENDER. _resolve_sources verifies media
        EXISTS but not that its verdict permits use, so an edit composed from
        BLOCKED footage renders successfully today. F-4 makes this sharp — an
        editor is a transformation machine, and transformation must never
        launder unusable material. T-044, and it should be next.
    decisions: [DR-002, DR-016]
