  - id: T-043
    title: "Renders count against the storage ledger"
    objective: >
      A render writes bytes to disk that the ledger knows nothing about. DR-006
      makes the ledger the SOLE source of truth for the F-7 ceiling, so those
      bytes count zero and the 100 GB limit is silently wrong by the size of
      every render ever produced. This is the same class of defect as blocking
      finding B4, which is why it is its own task and not a line in T-042.
      Editing is the workload that produces the most bytes in this system, so
      the gap grows fastest exactly where it matters most.
