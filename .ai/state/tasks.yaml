    fabrications_introduced: []
    assumptions:
      - >
        The form POST renders its result directly rather than post/redirect/get.
        A redirect would discard the operation's return value, which is the
        reason to run it. The cost is that a browser refresh re-submits; the page
        says so for mutating operations, and the irreversible ones keep their own
        PRG routes under /posts/{id}.
      - >
        An empty text input submits "", which registry.validate() already treats
        as absent (it tests `value is None or value == ""`). Optional parameters
        left blank therefore fall to their declared default rather than becoming
        empty strings. Pinned by test_optional_parameter_left_blank_uses_its_default
        rather than left as a reading of the registry.
      - >
        An unchecked checkbox submits nothing at all, so a bool parameter left
        alone is absent rather than false. No bool parameter is registered today,
        so this is untested against a real operation — recorded rather than
        implied.
    open_items:
      - >
        DISCLOSURE, not enforcement: /ops/approve-post presents a bare post_id +
        decision form, so an operator can approve without the rights verdict,
        ruleset version and asset hash on screen — which is what T-005 AC-1
        requires of the approval surface. The server still refuses a
        non-PERMITTED asset (proven by test_rights_gate_still_refuses_through_the_form),
        so F-3 holds; what is weaker is what the human SEES before deciding.
        This is not new — /api/op/approve-post has always allowed exactly this —
        but it now has an HTML front door. Mitigated for now by rendering
        op.danger before the control and linking post-entity operator operations
        to the dashboard's review screen. A stronger fix would redirect
        approve-post and publish-post to /posts/{id} instead of offering a raw
        form; that changes T-005's surface and belongs in its own task.
      - >
        No file upload. `ingest` takes source_path, a path on the server's
        filesystem, so the browser form asks the operator to type a path rather
        than choose a file. Correct for a single-operator local tool and it keeps
        the two surfaces identical, but it is the least browser-like part of this.
    decisions: [DR-002, DR-004]
    required_dimensions: [correctness, human_experience, accessibility, security, error_handling, testing, documentation]
    independent_review:
      reviewer: "orchestrating session (did not implement this task)"
