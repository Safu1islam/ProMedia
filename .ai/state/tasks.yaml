        test_the_locking_and_creating_sets_are_what_this_task_intended.
    open_items:
      - >
        connect-account is create-OR-update: it preserves the account id when
        platform+handle already match (T-023), so a reconnect is an unlocked
        write to an existing account. Its natural key is not an entity id, so
        locking it needs a different mechanism than this task's. Recorded rather
        than approximated. Impact is low — connecting an account is operator
        authority and C-17 fixes the human count at 1.
      - >
        ENTITY_LOCKED has no dedicated surface signal: the web adapter's status
        map does not list it, so it falls through to HTTP 400, and the CLI uses
