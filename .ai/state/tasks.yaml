          {'agent': 'agent-alpha', 'entity_id': 'as_does_not_exist',
          'entity_type': 'asset', ...}". Reverted and hash-verified as above.
    review: []
    fabrications_introduced: []
    assumptions:
      - >
        Entity id is read from the parameter named <entity>_id, matching the key
        set registry._entity_id already reads out of a result. Every mutating
        operation that acts on an existing entity declares exactly that name, so
        no per-operation mapping table is needed.
      - >
        An operation that CREATES its entity (ingest, queue-post,
        connect-account) declares no such parameter and therefore takes no lock:
        there is no id yet, so no other agent can be holding one. Stated in
        lock_target's docstring and pinned by
        test_the_locking_and_creating_sets_are_what_this_task_intended.
    open_items:
      - >
        connect-account is create-OR-update: it preserves the account id when
        platform+handle already match (T-023), so a reconnect is an unlocked
        write to an existing account. Its natural key is not an entity id, so
        locking it needs a different mechanism than this task's. Recorded rather
        than approximated. Impact is low — connecting an account is operator
        authority and C-17 fixes the human count at 1.
      - >
        ENTITY_LOCKED has no dedicated surface signal: the web adapter's status
        map does not list it, so it falls through to HTTP 400, and the CLI uses
        the base exit code 1. Both surfaces agree, which is what F-1 requires,
        and tests/test_locking.py pins the pair. 409 Conflict would be more
