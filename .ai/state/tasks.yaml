        result: PASSED
        evidence: >
          tests/test_performance.py::test_cli_cold_start_within_budget — executed.
          Measured on an idle machine after deferring the PyYAML import:
          p50 = 655 ms, p95 = 697 ms against the 1000 ms C-4 budget (30% headroom).
          Before that change: p50 = 812 ms, p95 = 932 ms (7% headroom).
          Baseline `python -c pass` on this machine = 194 ms, so ~460 ms is
          ProMedia's own import cost and ~194 ms is the interpreter floor.
          DR-001's stated weakness is therefore confirmed real but within budget.
        evidence: "planned check: tests/test_performance.py::test_cli_cold_start_within_budget � NOT YET EXECUTED"
    required_dimensions: [measured_baseline, measured_after, correctness_preserved, documentation]

  - id: T-018
    title: "publish-tick command and Windows Task Scheduler registration"
    objective: "Implements DR-009. Outside the operator-scoped v1 slice."
    change_class: infrastructure
    mode: critical
    owner_role: implementer
    assigned_model_tier: standard
    status: complete
    claimed_by: "claude-code-session-next3"
    depends_on: [T-011]
    blocks: []
    owned_paths:
      - promedia/core/scheduling.py
      - promedia/core/ops/schedule.py
      - promedia/core/ops/__init__.py
      - tests/test_schedule.py
      - tests/test_registry.py
      - docs/HUMAN-ACTIONS.md
    owned_paths_note: >
      Split the way every other capability is split: logic in core/scheduling.py,
      registration in ops/schedule.py. tests/test_registry.py was added to the
      claim because it PINS the operator-authority set, and publish-tick joins it
      — see the AC-2 evidence; that pin firing is what forced the authority
      question rather than letting it pass unexamined.
    acceptance_criteria:
      - id: AC-1
        statement: "A window missed by more than the configured tolerance is marked missed and escalated, never posted late."
        result: PASSED
        evidence: >
          C-27, the constraint the whole design exists to honour.
          test_a_missed_window_is_marked_missed_and_not_published schedules an
          hour in the past against a 300s tolerance and asserts status 'missed'
          AND publications count 0 — the negative assertion is the one that
          matters. test_the_miss_is_escalated_not_just_recorded asserts the audit
          entry. test_a_window_just_inside_the_tolerance_still_publishes covers
          the opposite direction, so over-strictness would fail too.
          test_the_tolerance_boundary_comes_from_configuration moves the CONFIG
          rather than the clock and shows the same post is due or missed
          accordingly (C-26, protocol 05).
          Falsified: treating every past window as due produced 4 failures
          including a real publication for a long-closed window.
      - id: AC-2
        statement: "The tick publishes only what the operator already approved, and creates no authority of its own."
        result: PASSED
        evidence: >
          F-2. publish-tick is operator authority because it reaches external
          platforms — test_an_agent_cannot_run_the_tick. It publishes through
          posts.publish, so every gate re-runs at publish time:
          test_the_rights_gate_still_refuses_through_the_tick approves a post
          while PERMITTED, degrades the asset with model evidence, and asserts
          the tick refuses with RIGHTS_BLOCKED and leaves the post approved —
          B3 variant C on a timer, which is the case where a scheduler could
          publish something the operator would no longer approve.
          test_an_unapproved_post_is_never_published_by_the_tick and
          test_an_unscheduled_post_is_never_touched cover the two ways a tick
          could sweep up work nobody authorised.
      - id: AC-3
        statement: "The tick is idempotent and preserves scheduled order."
        result: PASSED
        evidence: >
          test_running_the_tick_twice_publishes_once asserts publications == 1.
          Idempotence is INHERITED, not restated: posts.publish claims the post
          transactionally before the external call (finding B2), so the tick adds
          nothing on top — which is the point, since a scheduler with its own
          copy of the publish path is how the two drift.
