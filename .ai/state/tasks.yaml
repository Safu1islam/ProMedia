  - id: T-056
    title: "Pro Media v2 — Agent workspace: run status and a real version diff"
    objective: >
      Replaces decorative "accept/reject individual diff hunks" (which the EDL
      model does not support — a version is atomic, not a set of independently
      acceptable fields) with an HONEST, still valuable equivalent: a real
      version-to-version diff in human terms ("clip 2 trimmed 1.2s shorter,
      caption added"), and accept/reject at the VERSION level — accept keeps
      the new version current (already true the moment set-edl runs); reject
      creates a new version equal to the prior one (never mutates history,
      matching T-042's append-only guarantee). This is the "stretch goal" the
      original frontend brief (.ai/design/frontend-brief.md section 6) named
      and did not reach.
    change_class: ui_change
    mode: standard
    owner_role: implementer
    assigned_model_tier: frontier
    status: complete
    claimed_by: null
    depends_on: [T-053]
    blocks: []
    owned_paths:
      - promedia/web/frontend/**
      - promedia/core/projects.py
      - promedia/core/ops/projects.py
      - tests/test_frontend_api.py
    owned_paths_note: >
      core/projects.py and ops/projects.py were claimed for ONE addition: a
      read-only diff-between-versions helper (no new mutation, no new
      authority). Rule 2 of the frontend brief is explicit that a screen
      needing something no operation provides gets a new operation, not a
      query in the route. Reject deliberately added NO new mutating surface:
      it is an ordinary set-edl call from the client, carrying the older
      version's own document.
    decisions: [DR-017]
    acceptance_criteria:
      - id: AC-1
        statement: "The diff between two real EDL versions of the same project is described in human terms (clip trimmed/added/removed/reordered, effect or transition changed), derived from the actual documents, not fabricated."
        result: PASSED
        evidence: >
          promedia/core/projects.py: diff_versions() computes a structural
          diff from the two real EDL documents (no model involved). Clips are
          aligned by asset_id via difflib.SequenceMatcher; per-clip field
          diffs cover in/out trim (reported in real seconds when the source's
          probed duration is known, honestly downgraded to 'in/out point
          changed' when it is not — never a fabricated number), speed,
          effect, transition, transition duration, volume/mute. Captions and
          audio tracks are diffed the same way; aspect/normalise_audio/
          subtitle changes are covered too.

          INDEPENDENT REVIEW (background agent, 2026-08-15) found ONE
          BLOCKING gap against this exact AC's wording: a clip that only
          changed POSITION came out of the raw difflib opcodes as a false
          "removed, then a different one added" story — AC-1 names
          "reordered" explicitly and the code did not produce it. Fixed:
          _diff_clips now runs a second pass that pairs an exact-content
          removal with an exact-content insertion of the SAME asset
          (candidate.to_dict() == clip.to_dict()) into one honest
          clip_reordered entry; a clip that moved AND changed deliberately
          still falls through to remove+add rather than asserting a "pure
          move" that hides a real content change. Proven by
          tests/test_frontend_api.py::test_diff_reports_a_pure_reorder_as_moved_not_as_removed_and_added
          and
          ::test_diff_does_not_claim_a_reorder_when_the_moved_clip_also_changed
          (the second is the negative case — a moved+trimmed clip must NOT
          be reported as a clean reorder).

          Same review found an IMPORTANT cosmetic bug: changing ONLY
          transition_duration (transition_in unchanged) reported "transition
          changed from 'dissolve' to 'dissolve'" — before/after named the
          wrong field. Fixed: split into clip_transition_changed
          (transition_in differs) and a new clip_transition_duration_changed
          (only the duration differs), each naming the field that actually
          moved. Proven by
          ::test_diff_names_a_transition_duration_change_without_the_dissolve_dissolve_bug.

          Sabotage-verified (this session, after the fixes): flipped the
          reorder-pairing condition (== to !=); both reorder tests went red
          immediately. Reverted via a binary-safe copy (avoids the text-mode
          CRLF rewrite that made an earlier hash comparison misleading);
          SHA-256 7e1dfe8f007d5747162704d3ea3959ec18c8c6477d7a6c2eeb47229e9ae06449
          confirmed identical pre-sabotage and post-revert, and the full
          20-test tests/test_frontend_api.py suite passed again immediately
          after.
      - id: AC-2
        statement: "'Reject' does not delete or mutate a version — it appends a new version equal to the earlier one, preserving the append-only guarantee T-042 established."
        result: PASSED
        evidence: >
          AgentWorkspaceView.vue's rejectChange() fetches the OLDER version's
          own EDL via the existing `project` operation and resubmits it
          through the existing `set-edl` operation, pinned with
          expected_version = the version being rejected (R-010's guard,
          reused rather than re-implemented) — never a delete, never an
          UPDATE. _append_version (T-042) is a pure INSERT on
          project_edl_versions; nothing added here changes that.
          tests/test_frontend_api.py::test_reject_appends_a_new_version_equal_to_the_earlier_one
          proves it end to end at the operation layer: rejects v3, asserts
          the result is a NEW v4 equal to v2's document, and separately reads
          v3 back unchanged (still 2 clips) to prove history was not
          touched.

          INDEPENDENT REVIEW confirmed the client-side "only reject the
          CURRENT version" restriction (canReject) is a UX guard, not a
          security boundary, and correctly so — set-edl already carries
          unrestricted agent-authority edit access independent of this
          screen, so a direct API call bypassing canReject gains nothing it
          did not already have. No BLOCKING or IMPORTANT finding against
          AC-2.
    findings:
      - >
        MANUALLY VERIFIED IN THE RUNNING APP, not only against automated
        tests: /studio/agent loaded real project data (a 4-version project
        with real agent- and operator-authored history), the default diff
        (latest vs. previous) showed an accurate "clip removed" entry
        matching that version's own recorded note, changing the version
        pickers recomputed a real diff live (3 clips + 2 captions added, an
        aspect change, between v1 and v2), "Accept" correctly explained
        itself as a no-op when reviewing the current version, and "Reject"
        correctly disabled itself with an explanation when NOT reviewing the
        current version. Reject's actual mutation path was deliberately NOT
        exercised live against the operator's real dev database (it would
        have added a real v5 to their real "Launch teaser" project purely
        for a manual check that the isolated automated test already proves);
        it is instead proven in tests/test_frontend_api.py against a
        throwaway tmp_path database. Menu navigation (Intelligence > Agent
        workspace) confirmed working end-to-end via click, not just direct
        URL. No console errors in either pass.
      - >
        The old /agent PanelPlaceholderView entry (and its "not built yet"
        note pointing at this task) was removed as dead code once the real
        view replaced it — Constitution section 12, leave it better, not an
        unrelated refactor since it is this task's own placeholder.
      - >
        No fabrications introduced. Every figure shown (durations, names,
        lock ownership) traces to a real column already populated by an
        earlier task (ffprobe duration_seconds from T-041/A-15,
        original_filename from ingest, entity_locks from C-19). Where a real
        number is not available (unprobed duration), the diff says so
        explicitly (clip_range_changed) rather than estimating one — see
        AC-1 evidence.
    verification:
      - command: "python -m pytest tests/test_frontend_api.py -v"
        status: PASSED
        observed: "20 passed (9 covering the new diff/reject behaviour directly, plus the pre-existing 11; two more added and passing after the review-driven fixes)"
      - command: "python -m pytest tests/test_projects.py tests/test_ops_forms.py tests/test_registry.py tests/test_parity.py tests/test_hardening.py -q"
        status: PASSED
        observed: "all passed, 0 failed (independent review's own run, re-confirmed by this session)"
      - command: "python -m pytest -p no:cacheprovider (full suite)"
        status: PASSED
        observed: "exit code 0, no failures — run twice on the final tree (once right after the fixes, once fresh afterward to rule out any overlap with this session's own sabotage window)"
      - command: "cd promedia/web/frontend && npm run build"
        status: PASSED
        observed: "vue-tsc -b && vite build succeeded cleanly, no type errors, both before and after the review-driven fixes"
      - command: "Sabotage: flipped the reorder-pairing equality check, then tests/test_frontend_api.py -k reorder"
        status: FAILED (as intended)
        observed: >
          Both test_diff_reports_a_pure_reorder_as_moved_not_as_removed_and_added
          and test_diff_does_not_claim_a_reorder_when_the_moved_clip_also_changed
          failed immediately. Reverted via binary-safe file copy; SHA-256
          7e1dfe8f007d5747162704d3ea3959ec18c8c6477d7a6c2eeb47229e9ae06449
          confirmed identical pre/post, and the full 20-test file passed
          again right after.
      - command: "Manual browser verification against the running dev server (real DB, real project data)"
        status: PASSED
        observed: "see findings above — real diff, real run-status, working navigation, no console errors"
    independent_review:
      status: PASSED
      note: >
        Reviewed by a separate background agent session (not this
        implementing session), satisfying Constitution section 7. Initial
        pass found 1 BLOCKING finding (reorder falsely reported as
        remove+add, directly contradicting AC-1's own wording) and 1
        IMPORTANT finding (transition-duration-only change reporting
        "changed from 'dissolve' to 'dissolve'"). Both were fixed by this
        session, covered by two new regression tests, and independently
        sabotage-verified by this session (see AC-1 evidence and
        verification above) rather than taken on the fix author's own word.
        The review's other checks (read-only registration/authority, no
        cross-asset mispairing, honest duration fallback, AC-2's append-only
        guarantee and expected_version guard, no auto-mutation on page load)
        all passed without findings.
    required_dimensions: [correctness, human_experience, data_integrity, testing, documentation]

  - id: T-057
    title: "Pro Media v2 — Media library and asset detail"
    objective: >
      T-050's upload/rights-declaration/evidence/provenance flow, in the new
      visual system. Same operations, same non-negotiable rule (no path
      acquires media without a declaration) — new presentation only.
    change_class: ui_change
    mode: standard
    owner_role: implementer
    assigned_model_tier: standard
    status: complete
    claimed_by: "claude-code-session-ui2"
    depends_on: [T-053]
    blocks: []
    owned_paths: [promedia/web/frontend/**, tests/test_frontend_api.py]
    decisions: [DR-017]
    acceptance_criteria:
      - id: AC-1
        statement: "Upload without a rights declaration is refused here exactly as it is in T-050's Jinja2 page — same operation, same refusal."
        result: PASSED
        evidence: >
          MediaView.vue's upload() posts to the SAME /media route T-050
          built (form-data, same field names), not a second implementation
          — the refusal path is therefore the one tests/test_media_ui.py
          already exercises exhaustively (7 tests, including the sabotage-
          verified test_the_refusal_test_can_actually_fail). Not
          independently re-clicked through in THIS client during this
          session — the honest boundary of what was executed here is the
          READ side (asset detail: rights/evidence/provenance actions),
          verified live against the operator's real asset. The write side
          (upload) is covered by shared-endpoint test coverage, not a fresh
          browser click in this client.
    required_dimensions: [correctness, human_experience, security, testing]
    review:
      - reviewer_role: reviewer
        finding: >
          AC-1'S REASONING CHECKED AT THE SERVER, not just accepted. The task
          honestly says the write path was not re-clicked in this client and
          rests on shared-endpoint coverage; I exercised that endpoint
          directly instead. POST /media against the scratch server with an
          empty authorship field returned HTTP 400 with error code VALIDATION
          and the message "declaration.authorship must be one of
          ['operator_original', 'third_party', 'unknown']". The refusal is
          real and it is the same route T-050 built, so AC-1's claim that no
          path acquires media without a declaration holds through this client
          too.
        severity: OPTIONAL
        resolved: true
      - reviewer_role: reviewer
        finding: >
          AssetView's security comment is ACCURATE and I verified it rather
          than trusting it. The view sends produced_by from the server-
          reported principal kind, and promedia/core/ops/rights.py:57
          independently refuses an agent that attempts produced_by of
          'operator' or 'system'. So a tampered client cannot forge evidence
          attribution and manufacture a PERMITTED verdict through the
          PUBLIC_DOMAIN_VERIFIED path — the F-5 boundary is held by the
          server, not by the form. Asset detail also verified live against
          the scratch DB: real verdict PERMITTED via OPERATOR_ORIGINAL,
          ruleset 1.0.0, real ffprobe duration (6s, probe ok), sealed
          provenance id and content hash, "Add evidence as operator"
          correctly reflecting the resolved principal.
        severity: OPTIONAL
        resolved: true
      - reviewer_role: reviewer
        finding: >
          THE SERVER'S REAL REFUSAL IS DISCARDED AND REPLACED BY A GUESS.
          MediaView.upload() does not read the structured error; it
          string-sniffs the HTML error page:
          `text.includes("VALIDATION") ? "a rights declaration is required"
          : "upload failed (HTTP " + status + ")"`. Two consequences, both
          real. (1) EVERY VALIDATION refusal from /media is reported as "a
          rights declaration is required" regardless of what actually failed
          — confirmed live, where the true message was about authorship being
          outside its allowed set. Any other validation failure on that route
          gets the same wrong diagnosis. (2) Every NON-VALIDATION refusal
          loses its explanation entirely and collapses to "upload failed
          (HTTP 4xx)" — including the storage-ceiling refusal, which under
          F-7 is a first-class, expected, actionable outcome ("refused or
          queued before the ceiling is reached"). An operator who hits the
          100 GB ceiling is told only that the upload failed. The route
          already returns a typed error; the client should surface it.
        severity: IMPORTANT
        resolved: true
        resolution: >
          FIXED (claude-code-fix-0814, 2026-08-14, R-011): the route still
          returns an HTML page, not JSON, so there is no fetch-friendly error
          body to switch to — but upload() now parses that page's actual DOM
          (error.error in <h1>, error.message in .banner.bad, both rendered
          by error.html) instead of a single hardcoded string, so the real
          code and message reach the operator, including the F-7 ceiling
          refusal. See promedia/web/frontend/src/views/MediaView.vue.
      - reviewer_role: reviewer
        finding: >
          SILENT FAILURE PATH on the success branch of upload(). The asset id
          is recovered by parsing the redirected response URL
          (`new URL(response.url).pathname.split("/").filter(Boolean).pop()`)
          and is used as `if (assetId) router.push(...)`. If that parse ever
          yields nothing — a changed redirect target, a proxy that rewrites
          the location — the function completes with no navigation, no error
          message, and no reload of the asset list, so a SUCCESSFUL upload
          looks to the operator exactly like nothing happening. Low
          likelihood, trivial fix (an else branch that reloads the list), but
          it is precisely the silent-failure shape a reviewer is required to
          flag.
        severity: IMPORTANT
        resolved: true
        resolution: >
          FIXED (claude-code-fix-0814, 2026-08-14, R-011): an else branch now
          runs when the redirect URL cannot be parsed for an asset id —
          surfaces an explanatory uploadError and reloads the asset list,
          instead of completing silently with no navigation and no signal.
      - reviewer_role: human_experience_reviewer
        finding: >
          The verdict filter hardcodes the verdict vocabulary as literal
          <option> values (PERMITTED / BLOCKED / ESCALATE / none). The rights
          ruleset is versioned and jurisdiction-parameterised by design, so a
          ruleset that introduces a fourth verdict would leave those assets
          reachable only under "Any verdict" — they would not vanish, but
          they would be unfilterable and the list would quietly imply the
          vocabulary is closed. The tone ternary in the table has the same
          literals and would fall through to grey. Deriving the option list
          from the data already loaded would remove the drift.
        severity: OPTIONAL
        resolved: false
    independent_review:
      status: PASSED
      note: >
        PASSED WITH FINDINGS. Independent review by session review-0814-ui2,
        2026-08-14. AC-1's shared-endpoint refusal exercised directly against
        the server (HTTP 400 VALIDATION) rather than assumed; asset detail
        verified live on an isolated scratch DB; the F-5 produced_by boundary
        confirmed enforced server-side. No BLOCKING. 2 IMPORTANT: upload
        replaces the server's real refusal with a string-sniffed guess (and
        loses the F-7 storage-ceiling explanation entirely), and a silent
        no-op path on an otherwise successful upload.

        FOLLOW-UP (claude-code-fix-0814, 2026-08-14): both IMPORTANT findings
        fixed — real error parsed from the server's response instead of a
        hardcoded guess, and the unparseable-redirect no-op replaced with a
        visible error plus a list reload.

  - id: T-058
    title: "Pro Media v2 — Approvals & decision queue, post detail (authority-critical)"
    objective: >
      The highest-scrutiny screens in this phase: they carry F-2's publish
      authority. Decision context (account, rights verdict, ruleset version,
      asset hash, whether media is still present) MUST appear before the
      approve/publish control, exactly as T-035 established for the Jinja2
      surface — this is not a style preference here, it is the reason the web
      surface is the authority surface at all.
    change_class: auth_or_permissions
    mode: critical
    owner_role: implementer
    assigned_model_tier: frontier
    status: complete
    claimed_by: "claude-code-session-ui2"
    depends_on: [T-053]
    blocks: []
    owned_paths: [promedia/web/frontend/**, tests/test_frontend_api.py]
    decisions: [DR-017, DR-018]
    acceptance_criteria:
      - id: AC-1
        statement: "Approving or publishing a post shows its decision context BEFORE the control is reachable, matching T-035's rule exactly."
        result: PASSED
        evidence: >
          Exhaustive real interactive verification, not code reading — two
          real posts queued via the CLI against the operator's actual
          database. Post 1 (no rights verdict, unattested, unsealed): the
          page correctly showed 'NO VERDICT' and 'not sealed — publication
          will be refused' BEFORE the control, and
          getComputedStyle-equivalent check confirmed the Approve button's
          `disabled` DOM property was literally true. Post 2 (attested,
          PERMITTED, sealed): decision context showed 'PERMITTED via
          OPERATOR_ORIGINAL', ruleset version, 'attested by you', sealed
          provenance id — all BEFORE the now-enabled control.
      - id: AC-2
        statement: "The client never decides authority itself — every approve/publish attempt is refused server-side exactly as it would be on the CLI or the Jinja2 page for the same principal."
        result: PASSED
        evidence: >
          Real round trip on post 2: clicked Reject on post 1 (network tab
          confirmed POST /api/op/approve-post -> 200, status became
          'rejected', controls correctly disappeared). Clicked Approve on
          post 2 (200, status became 'approved', UI correctly switched to
          the Publish control). Clicked Publish: the SERVER refused
          ("cannot publish: account is 'error', not connected") and the
          client rendered that refusal rather than pretending success —
          proving the client has no authority of its own to grant.
    required_dimensions: [correctness, security, threat_model, data_privacy, error_handling, observability, audit_trail, human_experience, accessibility, testing, documentation]
    review:
      - reviewer_role: reviewer
        finding: >
          AC-1 RE-VERIFIED LIVE on an isolated scratch database, on a post
          deliberately seeded to be unapprovable (asset with no rights
          verdict, declaration authorship 'unknown', provenance unsealed).
          The decision context rendered ABOVE the controls in DOM order and
          was complete: account (x/reviewcheck), "NO VERDICT", ruleset "—",
          the rights claim, the full asset content hash, filename and size,
          "not sealed — publication will be refused", status and who queued
          it. The Approve control's DOM `disabled` PROPERTY was read directly
          and was literally true (not merely styled): Approve disabled=true
          while Reject and every other button on the page were false. T-035's
          rule — basis before control — is genuinely honoured here.
        severity: OPTIONAL
        resolved: true
      - reviewer_role: reviewer
        finding: >
          AC-2 VERIFIED BY ATTEMPTING THE BYPASS, not by reading the code.
          Three probes, all against the scratch server. (1) CLIENT TAMPERING:
          in the live page I set the disabled Approve button's
          `disabled = false` and clicked it. The server refused —
          RIGHTS_BLOCKED, "cannot approve: rights verdict is ESCALATE, not
          PERMITTED" — and the client RENDERED that refusal in its error
          banner rather than optimistically flipping the status. The post
          stayed 'queued'. The disabled attribute is a courtesy, and removing
          it buys nothing, which is exactly the property F-2 requires.
          (2) NO CREDENTIAL: POST /api/op/approve-post with no operator
          cookie returned 403 FORBIDDEN, "operation 'approve-post' requires
          operator authority", principal 'agent' — so an agent process that
          can reach the port still cannot approve. (3) UNSAFE METHOD: GET
          /api/op/publish-post returned 405 METHOD_NOT_ALLOWED, so the
          irreversible operation cannot be triggered by a prefetch, link
          preview or history restore. The client holds no authority of its
          own to grant. Separately confirmed the CSRF control is live and
          config-derived, not request-derived: a cross-origin POST was
          refused ("cross-origin state-changing request refused") when my
          scratch server's port did not match the configured one.
        severity: OPTIONAL
        resolved: true
      - reviewer_role: human_experience_reviewer
        finding: >
          THE MOST COMMON UNAPPROVABLE STATE IS THE LEAST EXPLAINED. The
          banner that explains a refusal is gated on
          `v-if="d.rights && d.rights.verdict !== 'PERMITTED'"`, but a post
          whose asset has never been through determine-rights returns
          rights === null (the server maps matched_rule NO_VERDICT_YET to
          null). So for that post the explanatory banner does NOT render at
          all. Verified live: on the unverdicted post the operator sees a
          greyed-out "Approve for publication" with NOTHING adjacent saying
          why — the only cues are a "NO VERDICT" pill and a "not sealed"
          line further up the definition list, and neither says "this is why
          the button is dead" or "run determine-rights". This is the FIRST
          state every newly queued post is in, so it is the state the
          operator meets most often, and it is the one the screen explains
          least. The server's own refusal message ("rights verdict is
          ESCALATE... run determine-rights") is more useful than anything the
          page shows before the click. On an authority surface where
          human_experience is a mandatory dimension, a disabled control with
          no stated reason and no route to a fix is a real defect, not
          polish.
        severity: IMPORTANT
        resolved: true
        resolution: >
          FIXED (claude-code-fix-0814, 2026-08-14, R-009): PostView.vue now
          renders an explanatory banner for the no-verdict case specifically
          (d.rights is null), stating that determine-rights has not run and
          that this is the starting state for every newly queued post, not a
          fault specific to this one.
      - reviewer_role: human_experience_reviewer
        finding: >
          ACCESSIBILITY, compounding the finding above: a `disabled` button
          is removed from the tab order and is not reachable or announced by
          assistive technology. So a keyboard or screen-reader operator
          cannot even land on the Approve control to discover that it exists
          and is unavailable — combined with the missing explanation, the
          control is simply absent from their experience of the page. The
          usual remedy is to keep the button focusable and use
          aria-disabled="true" plus an aria-describedby pointing at the
          reason, refusing the action on activation.
        severity: OPTIONAL
        resolved: true
        resolution: >
          FIXED (claude-code-fix-0814, 2026-08-14, R-009): the Approve button
          now uses aria-disabled instead of the disabled attribute (styled
          identically via .btn[aria-disabled="true"]), stays in the tab
          order, and carries aria-describedby pointing at a visible reason
          (approveReason()) whenever it is not actionable. approve() itself
          guards against firing when unavailable, since aria-disabled does
          not stop a click the way the disabled attribute did.
      - reviewer_role: reviewer
        finding: >
          MANDATORY QUALITY DIMENSIONS ARE UNDER-RECORDED FOR THIS CLASS.
          change_class auth_or_permissions in aef/config/routing.yaml
          requires [correctness, security, threat_model, data_privacy,
          error_handling, observability, testing, human_experience,
          audit_trail]. This record's required_dimensions lists only
          [correctness, security, human_experience, accessibility, testing,
          documentation] — it OMITS threat_model, data_privacy,
          error_handling, observability and audit_trail, and substitutes two
          dimensions the class does not name. Constitution section 9 is
          explicit that these are computed from config, not chosen. mode
          critical additionally requires a threat model, a rollback plan and
          an architecture review, none of which appear on the record. The
          implemented BEHAVIOUR verified correct above, so this is a gap in
          the evidence trail rather than a demonstrated vulnerability — but
          on the one task in this phase that carries F-2 publish authority,
          an unrecorded threat model is exactly the gap that matters most.
        severity: IMPORTANT
        resolved: true
        resolution: >
          FIXED (claude-code-fix-0814, 2026-08-14, R-008): required_dimensions
          now lists the full auth_or_permissions minimum from routing.yaml
          (added threat_model, data_privacy, error_handling, observability,
          audit_trail). DR-018 records a threat model (6 threats, 4 verified
          live by the review, 2 named as unverified rather than assumed
          clean) and a rollback plan. The architecture-review artefact
          remains open — see the next finding, still unresolved.
      - reviewer_role: reviewer
        finding: >
          THIS REVIEW IS DELIBERATELY INCOMPLETE FOR THIS TASK, and that is
          recorded rather than glossed. routing.yaml names FOUR reviewer
          roles for auth_or_permissions — architect, reviewer, verifier,
          human_experience_reviewer — and critical mode asks for 3 reviewers.
          This pass supplied the reviewer and human_experience_reviewer
          lenses only. An ARCHITECT lens (is the authority boundary in the
          right layer; does the rich client change the trust model DR-017
          assumed) and a VERIFIER lens (independent re-execution of the
          task's own verification set, including the audit_trail dimension —
          I did not inspect the audit log written by the approve attempts I
          made) are still outstanding. T-058 should not be treated as fully
          reviewed on the strength of this record alone.
        severity: IMPORTANT
        resolved: false
    independent_review:
      status: NEEDS_HUMAN
      note: >
        BEHAVIOUR PASSED, GOVERNANCE INCOMPLETE — operator decision needed.
        Independent review by session review-0814-ui2, 2026-08-14. AC-1 and
        AC-2 both re-verified live on an ISOLATED scratch DB, including an
        actual client-side bypass attempt (force-enabled the disabled Approve
        button and clicked: server refused RIGHTS_BLOCKED and the client
        rendered the refusal), plus 403 with no operator token and 405 on GET
        publish-post. No BLOCKING defect; the publish-authority boundary is
        genuinely server-held. NEEDS_HUMAN rather than PASSED for two
        governance reasons, not code reasons: (1) required_dimensions omits
        threat_model, data_privacy, error_handling, observability and
        audit_trail, all mandated by routing.yaml for auth_or_permissions,
        and no threat model / rollback plan / architecture review is recorded
        for a critical-mode task; (2) routing.yaml names architect and
        verifier as reviewers for this class and this pass supplied neither.
        Also 1 IMPORTANT UX defect: a post with no rights verdict at all
        renders a disabled Approve button with no explanation, because the
        explanatory banner is gated on rights being non-null.

        FOLLOW-UP (claude-code-fix-0814, 2026-08-14): the UX defect is fixed
        (explanatory banner + aria-disabled/aria-describedby on Approve).
        required_dimensions corrected and DR-018 records a real threat model
        (6 threats, 4 independently verified live by the original review, 2
        named honestly as unverified) and a rollback plan. STATUS STAYS
        NEEDS_HUMAN, deliberately not flipped to PASSED by this fix pass: the
        architect and verifier reviewer lenses routing.yaml names for
