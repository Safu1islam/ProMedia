        resource, and NOT_FOUND's exit code 1 matches the class in test_parity's
        SURFACE_SIGNALS.
      - >
        The HTML routes render a 400 error page for a hidden operation rather than 404,
        because their status maps predate this and list only FORBIDDEN/RIGHTS_BLOCKED/
        APPROVAL_REQUIRED. The call is refused and nothing executes, which is what T-031
        requires; refining those status maps would be scope growth. Noted, not fixed.
      - >
        The NOT_FOUND detail carries the sorted list of known operations, matching what
        invoke() already does. Not an information leak on this surface: /api/ops and /ops
        publish the same list to any caller by design (F-1, S4).
    required_dimensions: [correctness, security, error_handling, testing]
    independent_review:
      reviewer: "orchestrating session (did not implement this task)"
      checks:
        - "Scope: only promedia/web/app.py and tests/test_hardening.py, plus state. cli.py, core/registry.py, core/db.py, core/posts.py and tests/test_parity.py byte-identical to HEAD — PASSED"
        - "The captured snapshot is genuinely gone: no `operations = load_operations()` remains in create_app, and every path (dashboard, /ops, /api/ops, guards, run(), api_op) reaches the registry through the single accessor — PASSED"
        - "No sabotage leftovers anywhere in the package — PASSED"
        - "Full suite re-run independently: 236 passed — PASSED"
        - >
          MY OWN exploit, aimed deliberately at the part NOT in the brief — the
          HTML route. Hid publish-post from the registry and POSTed
          /posts/{id}/publish: refused, publications table still 0. The
          implementer found this widening itself (run() is shared with the HTML
          routes and previously reached invoke() with no resolution at all) and
          fixed it rather than staying inside the brief — PASSED
        - "Same exploit on /api/op over GET: 404 NOT_FOUND, nothing published — PASSED"
        - >
          Opposite failure direction checked, which is the one a careless fix
          would introduce: nothing is hidden. Registry 29, /api/ops 29, none
          missing — PASSED
        - >
          The fix did not swallow the guard it sits in front of: a PRESENT
          operation over GET still returns 405 METHOD_NOT_ALLOWED, not 404 — PASSED
        - "Real publish still works end to end through the UI: 303, publication recorded, simulated=True — PASSED"
        - "No acceptance criterion anywhere in tasks.yaml is PASSED without evidence; locks released — PASSED"
      accepted_design: >
        Removing the second source of truth rather than reconciling two was the
        right call and is what the brief asked for. The residual explanation is
        honest: invoke() stays name-based because that contract is shared with
        the CLI (DR-002), so the adapter cannot hand it a resolved Operation and
        literally collapse the two lookups. Making its own resolution the gate —
        nothing reaches invoke() that did not come out of _operation() — is the
        available equivalent.
      accepted_behaviour_change: >
        An unregistered name at /api/op/{name} now answers 404 NOT_FOUND where it
        answered 400 VALIDATION. No test asserted the old status, invoke() still
        raises ValidationError for direct callers, and NOT_FOUND carries exit
        code 1, which is the pair tests/test_parity.py already pins. Accepted.
      not_fixed:
        - >
          The HTML routes render a 400 error page for a hidden operation rather
          than 404, because their status maps predate this task. Confirmed by my
          own run (status=400). The call IS refused and nothing executes, which
          is what AC-1 requires, so this is cosmetic. Left as the implementer
          recorded it rather than growing scope — it belongs with T-032, which is
          already about surface status accuracy.
      not_verified:
        - "Real browser behaviour. Everything is TestClient, unchanged from before this task — NOT_RUN."

  - id: T-032
    title: "ENTITY_LOCKED has no distinct surface signal, so an agent cannot tell 'locked' from 'failed'"
    objective: >
      Raised by the T-027 implementer. The web status map does not list
      ENTITY_LOCKED so it falls through to HTTP 400, and the CLI returns the base
      exit code 1. Both surfaces agree, so F-1 holds and the parity gate passes —
      but aef/protocols/05-execution.md tells a blocked agent to "take a different
      ready task", and it cannot act on that if a contended entity is
      indistinguishable from a business-rule failure. 409 Conflict is the accurate
      web status; the CLI needs its own code.
      Note this changes a documented contract (DR-005 fixes the exit-code
      meanings), so it needs a decision record, not just an edit.
    change_class: api_change
    mode: standard
    status: ready
    owned_paths: [promedia/errors.py, promedia/web/app.py, promedia/cli.py, .ai/state/decisions]
    found_by: "implementer agent during T-027"
    acceptance_criteria:
      - id: AC-1
        statement: "A contended entity returns 409 on the web surface and a dedicated exit code on the CLI, and the two remain in agreement under the parity gate."
        result: NOT_RUN
        evidence: "not implemented"
      - id: AC-2
        statement: "The exit-code change is recorded in a decision record that supersedes the relevant part of DR-005."
        result: NOT_RUN
        evidence: "not implemented"
    required_dimensions: [correctness, api_contract_stability, backward_compatibility, error_handling, documentation, testing]

  - id: T-033
    title: "connect-account reconnect is an unlocked write to an existing account"
    objective: >
      Raised by the T-027 implementer. Since T-023, connect-account preserves the
      account id when platform+handle already match, so a credential rotation
      mutates an existing entity — but the operation declares no account_id
      parameter, so lock_target() returns None and no lock is taken. Its natural
      key is platform:handle, which is not an entity id, so locking it needs a
      different mechanism rather than an invented id.
      Low impact today: operator authority, and C-17 fixes humans at 1.
    change_class: auth_or_permissions
    mode: standard
    status: ready
    owned_paths: [promedia/core/registry.py, promedia/core/ops/accounts.py]
    found_by: "implementer agent during T-027"
    acceptance_criteria:
      - id: AC-1
        statement: "A reconnect of an existing account takes an exclusive lock on that account, and a second agent attempting it concurrently is refused with ENTITY_LOCKED."
        result: NOT_RUN
        evidence: "not implemented"
    required_dimensions: [correctness, data_integrity, security, testing]

  - id: T-034
    title: "The web surface advertises 29 capabilities and can operate 4 of them"
    objective: >
      Raised by the operator, 2026-08-11, looking at /ops: "this is just a
      dashboard". Correct, and the gap is real. /ops renders the registry as a
      TABLE OF TEXT — name, authority, summary, parameters — with no control on
      it. The only operable HTML is /posts/{id}, which carries approve, reject,
      publish and release-claim. The other 25 capabilities are reachable from a
      browser only by hand-crafting a POST to /api/op/{name}.

      This does NOT violate S4 or F-1: parity is asserted between the registry
      and /api/op/{name}, and that route does reach all 29. The defect is
      narrower and is a human-experience one — DR-004 makes the web surface the
      operator's surface, and an operator cannot use 25 of their own
      capabilities without a terminal.

      Fix the projection, not the registry: generate a form per operation from
      the same Operation/Param metadata /ops already renders as prose. No new
      capability, no new authority path, no business logic in the adapter.
    change_class: ui_change
    mode: standard
    status: complete
    claimed_by: "claude-code-session-t034"
    owned_paths:
      - promedia/web/app.py
      - promedia/web/templates/op.html
      - promedia/web/templates/ops.html
      - promedia/web/templates/base.html
      - tests/test_ops_forms.py
      - README.md
    found_by: "operator, 2026-08-11"
    depends_on: [T-005, T-031]
    acceptance_criteria:
      - id: AC-1
        statement: "Every registered operation has an HTML page carrying a form with one control per declared parameter, generated from the registry rather than hand-written per operation."
        result: PASSED
        evidence: >
          GET /ops/{name} renders promedia/web/templates/op.html from the
          Operation/Param metadata: textarea for type json, checkbox for bool,
          number for int/float, password for sensitive, text otherwise.
          tests/test_ops_forms.py::test_every_operation_has_a_form_page is
          parametrised over load_operations() — 29 cases — and asserts a POST
          form plus a control per declared parameter, so a new capability fails
          here until it is reachable. ::test_capabilities_index_links_every_operation
          pins the route off /ops. Executed, observed pass.
      - id: AC-2
        statement: "Submitting the form executes the operation through the same guarded path as /api/op/{name}: T-031 resolution, T-025 origin check, F-2 authority in the operation layer, C-19 entity locking."
        result: PASSED
        evidence: >
          op_submit resolves through _operation() and calls guarded() -> run(),
          the identical path api_op takes. Proven by side effect, not by page
          text: ::test_submitting_a_form_performs_the_real_side_effect ingests a
          file from the browser and asserts the asset through list-assets;
          ::test_agent_authority_is_refused_by_the_operation_layer gets FORBIDDEN
          and the declaration stays agent-authored;
          ::test_rights_gate_still_refuses_through_the_form keeps a non-PERMITTED
          post queued; ::test_entity_lock_is_taken_through_the_form_route gets
          ENTITY_LOCKED naming agent-beta;
          ::test_cross_origin_submission_is_refused gets 403 with no state change.
          Executed, observed pass.
      - id: AC-3
        statement: "A GET of an operation form page executes nothing, whatever the operation's authority or mutates flag."
        result: PASSED
        evidence: >
          ::test_get_of_a_mutating_form_changes_nothing, parametrised over the 12
          mutating operations, GETs each with parameters that WOULD SUCCEED in
          the query string and compares assets, posts, accounts, publications,
          provenance, locks and the audit log before and after.
          ::test_get_of_the_form_writes_no_audit_entry GETs all 29 and asserts an
          empty audit log — invoke() audits every operator-authority and mutating
          attempt, so emptiness proves the render never reached it.
          Executed, observed pass. See verification: the FIRST version of this
          test passed under sabotage and was rewritten.
      - id: AC-4
        statement: "A sensitive parameter renders as a masked control, is never echoed back into the re-rendered form, and is refused if it arrives in the query string (T-024)."
        result: PASSED
        evidence: >
          ::test_sensitive_parameter_renders_masked drives off the registry, so a
          second sensitive parameter is covered without editing the test.
          ::test_a_submitted_secret_is_not_echoed_back_into_the_form asserts a
          canary is absent from both the success and the error re-render —
          render_op strips sensitive names from `submitted` rather than the
          template omitting a value attribute, so both halves must fail before it
          leaks. ::test_the_secret_reaches_the_store_and_nothing_else asserts the
          canary is absent from the iterdump and the audit log.
          ::test_sensitive_parameter_is_refused_in_the_query_string covers GET and
