# ---------------------------------------------------------------------------
# Independent review (protocol 06 stage 7). Reviewer role, separate agent and
# separate context from the implementer, per Constitution section 7 and
# aef/core/OPERATING-LOOP.md ("the reviewing role is never the implementing
# role, even if the same underlying model performs both").
#
# Two rounds. Round 1 found four BLOCKING defects; all four were fixed with a
# regression test written from the reviewer's own reproduction, and round 2
# re-verified every one by execution.
# ---------------------------------------------------------------------------

review:
  rounds: 2
  reviewer_role: reviewer
  independent: true
  method: >
    Adversarial. The reviewer executed attacks rather than reading code, and
    reported which guarantees were verified by execution versus by reading.

  blocking_findings:
    - id: B1
      summary: >
        `produced_by` guarded the F-5 permitting boundary but was a caller-supplied
        string, so an agent could write produced_by='operator' and manufacture a
        PERMITTED verdict — an agent clearing a rights flag, forbidden by F-2.
      resolved_by: promedia/core/ops/rights.py — authorship derived from ctx.principal
      regression_test: tests/test_review_regressions.py::test_agent_cannot_forge_operator_authored_evidence
      reverify: RESOLVED (round 2, by execution)

    - id: B2
      summary: >
        Publish checked for an existing publication, called the platform, then
        INSERTed — three unsynchronised steps. UNIQUE(post_id) deduplicates the
        RECORD, not the POST: two concurrent calls both reached the platform and
        one left no record. A double-click was sufficient.
      resolved_by: promedia/core/posts.py — _claim_for_publish() claims transactionally BEFORE the external call
      regression_test: tests/test_review_regressions.py::test_concurrent_publish_calls_the_platform_once
      reverify: RESOLVED (round 2 — 1 external call under a barrier tighter than the shipped test)

    - id: B3
      summary: >
        Derivative inheritance consulted only the immediate parent's verdict, once.
        Three laundering paths followed: an ungraded intermediate broke the chain;
        grading order changed the verdict (violating C-20); a source that degraded
        later left its derivative publishable. The reviewer published that last
        one end to end.
      resolved_by: promedia/core/rights.py — ancestry() + effective_verdict(), evaluated at gate time
      regression_test: tests/test_review_regressions.py::test_ungraded_intermediate_cannot_break_the_chain and 3 others
      reverify: RESOLVED (round 2 — refused at approve, not merely at publish)

    - id: B4
      summary: >
        commit() and release() ignored rowcount. A reservation expired and reclaimed
        mid-ingest meant bytes landed on disk counting ZERO against the ceiling,
        undetectably, because DR-006 makes the ledger the sole source of truth.
      resolved_by: promedia/core/storage.py — commit() raises LedgerDrift; release() scoped to 'reserved'
      regression_test: tests/test_review_regressions.py::test_commit_of_reclaimed_reservation_fails_loudly
      reverify: RESOLVED (round 2, both K2 and K3 reproductions)

