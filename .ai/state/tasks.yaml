      this change class. Actual: one independent reviewer agent, run repeatedly.
      Since T-028 the implementing and reviewing agents have been genuinely
      separate, which closes the worst of it — but the human-experience pass has
      always been performed by the implementing session, and
      framework.yaml sets self_review_counts_as_review false.
