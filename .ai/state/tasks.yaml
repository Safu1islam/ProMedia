    required_dimensions: [correctness, human_experience, accessibility, responsiveness, maintainability, testing, documentation]
    review:
      - reviewer_role: reviewer
        finding: >
          AC-1, AC-3 AND AC-4 RE-VERIFIED LIVE on an isolated scratch
          database seeded with a 3-clip EDL (blur / grayscale+dissolve /
          wipeleft) and one real ffmpeg render. The timeline rendered the
