      new and was added to the claim.
    acceptance_criteria:
      - id: AC-1
        statement: "Mutating operations claim an entity lock, and a second agent attempting the same entity receives ENTITY_LOCKED naming the owner."
        result: PASSED
        evidence: >
          registry.invoke() now derives a lock target from the operation
          (mutates + entity + a declared <entity>_id parameter), acquires before
          the handler with owner=ctx.agent_id and TTL from config locks.ttl_minutes,
          and releases in a finally. Seven operations lock: add-evidence,
          attest-declaration, determine-rights, seal-provenance, approve-post,
          publish-post, release-publish-claim. Executed:
          tests/test_locking.py, 13 passed; full suite 231 passed (was 218).
