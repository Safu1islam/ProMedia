      - id: AC-4
        statement: "The room clearly labels preview as proxy-quality where it is, rather than implying real-time full-resolution scrubbing this hardware cannot do."
        result: PASSED
        evidence: "PROGRAM monitor labelled 'PROGRAM · proxy preview' in the room bar, verified in the live DOM."
    verification:
      - command: "python -m pytest tests/test_frontend_api.py::test_media_file_serves_a_stored_assets_bytes tests/test_frontend_api.py::test_media_file_refuses_when_media_is_not_stored tests/test_frontend_api.py::test_media_file_404s_for_an_unknown_asset"
        status: PASSED
