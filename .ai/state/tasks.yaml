  - id: T-032
    title: "ENTITY_LOCKED has no distinct surface signal, so an agent cannot tell 'locked' from 'failed'"
    objective: >
      Raised by the T-027 implementer. The web status map does not list
      ENTITY_LOCKED so it falls through to HTTP 400, and the CLI returns the base
      exit code 1. Both surfaces agree, so F-1 holds and the parity gate passes —
      but aef/protocols/05-execution.md tells a blocked agent to "take a different
      ready task", and it cannot act on that if a contended entity is
      indistinguishable from a business-rule failure. 409 Conflict is the accurate
      web status; the CLI needs its own code.
      Note this changes a documented contract (DR-005 fixes the exit-code
      meanings), so it needs a decision record, not just an edit.
    change_class: api_change
    mode: standard
    status: complete
    owned_paths: [promedia/errors.py, promedia/web/app.py, promedia/cli.py, .ai/state/decisions]
    found_by: "implementer agent during T-027"
    implemented_by: "claude-code-session-t032 (implementer agent)"
    reviewed_by: "orchestrating session (Constitution 7 — not the implementing role)"
    acceptance_criteria:
      - id: AC-1
        statement: "A contended entity returns 409 on the web surface and a dedicated exit code on the CLI, and the two remain in agreement under the parity gate."
        result: PASSED
        evidence: >
          EntityLocked.exit_code = 4; ERROR_STATUS['ENTITY_LOCKED'] = 409 in a
          single module-level map now consulted by all five web routes (four
          duplicated inline maps removed). Suite 309 -> 322 passed, exit 0, run
          by the reviewer independently of the implementer's report.
          tests/test_surface_signals.py asserts 409 and exit 4 together in ONE
          test against a genuinely contended entity, so the pair cannot drift.
          Reviewer sabotage, at injection points the implementer did not use:
          (1) exit_code 4 -> 3, the plausible "reuse FORBIDDEN" edit, caught by 4
          assertions across 3 files; (2) the /ops/{name} route de-unified back to
          its own local dict, caught by exactly the one test covering that route.
          Both failures came from assertions, not collection errors. Both files
          restored and verified byte-identical by SHA-256
          (errors.py f4f4b1b5e33a2465124467e3bbd31c25cbee6c7bc9ec6032fa41bab9c292a602,
          app.py 83843d935e5e65e14367c131482852dab54acf18ca1a0ec01d5e3ae6386c4e43).
          Opposite direction also proven: VALIDATION still 400, FORBIDDEN still
          403, and a present unlocked post still approves (303) and renders (200).
          tests/test_parity.py's _assert_agreed was NOT touched; SURFACE_SIGNALS
          gained (409, 4). Noted honestly in that file: its 62 probes use
          sentinel ids against an unlocked store and therefore cannot produce
