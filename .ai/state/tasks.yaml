          either. Recorded as NOT_RUN rather than PASSED — see T-047's own
          record for the same withdrawal and the 15 named collateral failures
          it observed in files outside both tasks' owned paths.
    findings:
      - >
        THE PROJECTION PROBLEM: a render has no source file to read a size
        from before it exists. Projected as duration x a per-quality
        estimated-bitrate config table x a safety margin (1.25).
        storage.projected_render_bytes(). Duration comes from
        projects._projected_render_seconds(), summed over the EDL's clips
        (audio never extends it, matching how compile_render actually
        determines output length); a clip with an explicit `end` needs no
        lookup, one running to source end needs the source's ffprobe duration,
        falling back to media.unknown_clip_duration_seconds (60s, F-008) when
        that probe is absent, with duration_measured=False on the render
        result whenever the fallback fires.
        Two of the four bitrate figures are anchored to a real T-041
        measurement ('balanced' ~175000, 'hardware' ~95000 bytes/sec); 'fast'
        and 'quality' are extrapolated from CRF, not measured (F-007).
        OVERESTIMATE (the common case, measured live: 562500 projected vs
        119862 actual for a 3s near-static clip): harmless by construction —
        commit() overwrites the reservation with the true size the instant
        the render finishes, converging the ledger to truth. The only cost is
        a transient one: a concurrent render in the same window might see
        less headroom than truly exists.
        UNDERESTIMATE: also reconciled to truth at commit(), but leaves a
        narrow race between reserve() and commit() where a concurrent
        reservation is admitted against the too-low figure. This is inherent
        to any before-the-fact estimate, and is a STRICT IMPROVEMENT over
        ingest's derivative multiplier, which is never reconciled at all
        today — render is the first place a projected figure gets checked
        against a measured one.
      - >
        ORDERING: storage.commit() happens BEFORE the `renders` row insert,
        diverging from ingest.py's commit-after-insert order deliberately —
        bytes are already on disk once execute() returns, so the ledger
        should stop being blind to them as fast as possible. Worst
        crash-window outcome is an uncatalogued file (recoverable) rather
        than an under-counted TTL-expired reservation. ingest.py was not
        touched to align it (not owned by this task).
      - >
        NO SCHEMA CHANGE. A render reservation is kind='derivative' with
        asset_id NULL — test_commit_with_no_asset_id_is_a_derivative_with_no_asset.
      - >
        NO SECOND LOCKING SCHEME. render() relies entirely on the existing
        C-19 lock taken by invoke() (T-042 AC-3); nothing here touches
        entity_locks.
      - >
        REFACTOR: reserve() is now a thin wrapper over reserve_projected(),
        the one path that compares a projection to the ceiling; ingest and
        render both funnel through it. reserve()'s external signature is
        unchanged — tests/test_storage.py and tests/test_ingest.py pass
        unedited, and acquire.py's (T-046, concurrent) reserve/release calls
        needed no change.
      - >
        RESERVATION ID = RENDER ID (storage_ledger.id set to the render's own
        id, a plain TEXT primary key). This is what makes AC-3 possible with
        no schema change and no second table.
    fabrications_introduced: [F-006, F-007, F-008]
    fabrications_note: >
