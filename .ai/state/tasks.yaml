  - id: T-044
    title: "Rights and media availability gate before render and publish"
    objective: >
      An EDL references asset ids and nothing checks them. Today a render can be
      composed from BLOCKED footage, or from an asset whose media retention
      deleted, and it will succeed.
      F-4 is the constraint that makes this sharp: "transforming material never
      makes unusable material usable". An editor is precisely a transformation
      machine, so it is the most likely route by which unusable material reaches
      a publication — the exact laundering path B3 closed for derivatives.
      edl.asset_ids() exists so this check has one place to stand.
