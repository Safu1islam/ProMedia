  - id: T-028
    title: "The web half of the parity gate is a tautology (I8)"
    objective: "test_web_covers_every_operation compares /api/ops against load_operations(), but api_ops serialises that same dict — the assertion cannot fail and never exercises /api/op/{name}. S4 designates single-surface capabilities a build failure and DR-002 names this test as the enforcement mechanism."
