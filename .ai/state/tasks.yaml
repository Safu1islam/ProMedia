  # -------------------------------------------------------------------------
  # Durability — off-site backup of the permanent set (project.md 5.4).
  #
  # Planned 2026-08-13, closing the known_omission plan.yaml has carried since
  # the 0.2.0 retrofit: "in scope per project.md 5.4 but has no task ... it
  # needs a planning pass, not a guess at its shape."
  #
  # THE SHAPE, now that it has been looked at rather than guessed:
  #
  # The permanent set is four things (5.4): rights evidence, provenance chains,
  # published-post records, approval and audit log. All four live in SQLite, and
  # masters are explicitly TRANSIENT, so the artefact is megabytes — which is
  # what makes this cheap and is why 5.4 says it "removes what would otherwise
  # be the largest cost line".
  #
  # Mapped to tables, which is the decision T-036 has to make and pin:
  #   permanent : rights_declarations, evidence, rights_verdicts,
  #               provenance_records, posts, approvals, publications,
  #               accounts (identity + credential_ref, never a secret),
  #               assets (identity of what evidence is ABOUT), schema_version
  #   excluded  : storage_ledger and ingest_queue (facts about local disk,
  #               recomputable), entity_locks (session state — restoring a lock
  #               table would wedge every entity against a session that no
  #               longer exists)
  #
  # Two properties this work must not break, both already load-bearing:
  #   * DR-008 keeps credentials OUT of the database precisely so they are
  #     absent from backup artefacts. An export that carried a secret off-site
  #     would defeat the control the whole credential design exists to provide.
  #   * F-8 makes provenance records self-contained and integrity-hashed, so a
  #     restored record must still verify. That is what makes this a backup of
  #     evidence rather than a copy of some rows.
  #
  # Sequenced so that everything destination-independent lands first: T-038 is
  # the only node that needs an operator decision, and it is deliberately not a
  # dependency of T-036 or T-037.
  # -------------------------------------------------------------------------

  - id: T-036
    title: "Export the permanent set as a self-contained, verifiable artefact"
    objective: >
      Define the permanent set as an explicit table set and produce a single
      export artefact that can be verified without the database it came from.
      Destination-independent by design: what to back up is a different question
      from where to put it, and answering them together is how the second answer
      silently constrains the first.
    change_class: new_project
    mode: critical
    owner_role: implementer
    assigned_model_tier: standard
    status: complete
    claimed_by: "claude-code-session-next3"
    depends_on: [T-010, T-013]
    blocks: [T-037, T-038, T-039]
    owned_paths: [promedia/core/backup.py, promedia/core/ops/backup.py, promedia/core/ops/__init__.py, tests/test_backup.py, tests/test_registry.py]
    acceptance_criteria:
      - id: AC-1
        statement: "The exported table set is declared in one place, and a table added to the schema is either classified or fails the build."
        result: PASSED
        evidence: >
          PERMANENT_TABLES and TRANSIENT_TABLES in promedia/core/backup.py, and
          classify_tables() refuses any table in neither. The criterion's real
          subject is a table that does not exist yet, so
          test_a_new_unclassified_table_is_refused CREATES one and asserts both
          classify_tables and build() raise naming it — the alternative being a
          future migration whose table falls out of every backup silently and is
          discovered during a restore. The reverse direction (a declared table
          absent from the schema) also raises.
      - id: AC-2
        statement: "No credential value, and no operator token, appears anywhere in an export artefact — asserted with a canary, not by inspection."
        result: PASSED
        evidence: >
          test_no_credential_appears_anywhere_in_the_artefact connects an account
          with a canary secret, runs a full slice, and asserts the canary is
          absent from the SERIALISED artefact — bytes, not table selection, since
          an artefact carrying a secret would look entirely normal.
          test_the_operator_token_is_not_in_the_artefact covers the token, which
          grants publish authority over every account and lives in the credential
          store rather than the database. Both hold because DR-008 keeps secrets
          out of the DB; this is the assertion that the property is still true
          rather than still intended.
      - id: AC-3
        statement: "A sealed provenance record's integrity still verifies when read out of the artefact, with the source database absent."
        result: PASSED
        evidence: >
          test_provenance_integrity_verifies_out_of_the_artefact recomputes
          _integrity_hash over the payload taken from the serialised artefact and
          compares it to the stored hash, touching no database — which is the
          situation a restore actually happens in. F-8's guarantee survives the
          round trip, so this is a backup of evidence rather than of rows.
          test_the_evidence_chain_is_complete_in_the_artefact asserts all three
          rights tables plus approvals, publications and audit_log are populated.
      - id: AC-4
        statement: "The artefact carries its own integrity hash and schema version, and a tampered artefact is detected."
        result: PASSED
        evidence: >
          test_a_tampered_artefact_is_detected empties audit_log — the edit an
          attacker would actually want — and asserts verification fails with
          mismatched hashes. verify() takes the artefact rather than a path and
          consults no database, so it works off-site, which is the only place it
          matters (test_verification_needs_nothing_but_the_artefact).
          test_two_exports_of_an_unchanged_database_are_identical pins
          determinism, so "nothing changed" is detectable without a row diff.
      - id: AC-5
        statement: "entity_locks and the storage ledger are excluded, and the exclusion is pinned by a test that states why."
        result: PASSED
        evidence: >
          test_locks_and_ledger_are_excluded_with_a_stated_reason asserts all
          three are absent AND that each carries a substantive recorded reason,
          so the exclusion cannot decay into an unexplained omission. Restoring
          entity_locks would wedge every listed entity against sessions that no
          longer exist; restoring storage_ledger would assert a footprint that
          does not match the files present, and DR-006 makes the ledger the sole
          source of truth for the F-7 ceiling.
    verification:
      - command: "python -m pytest -p no:cacheprovider tests/test_backup.py"
        status: PASSED
        observed: "17 passed"
      - command: "python -m pytest -p no:cacheprovider"
        status: PASSED
        observed: "428 passed (401 before this task; +17 backup, +1 registry, +9 parity)"
      - command: "python -m pytest -p no:cacheprovider tests/test_parity.py"
        status: PASSED
        observed: >
          72 passed, up from 66 — the three new operations picked up
          automatically (3 x 2 probes) with no edit to the parity gate.
      - command: "python -m pytest -p no:cacheprovider tests/test_backup.py, with build() exporting permanent + transient tables"
        status: FAILED
        observed: >
          Sabotage of the plausible 'improvement' — back everything up so nothing
          is ever missing. Caught by
          test_locks_and_ledger_are_excluded_with_a_stated_reason
          ("assert 'entity_locks' not in ..."). Reverted; backup.py SHA-256
          d7f29f8674fe38f50b1d31b64a607363a8b0d37ab992d0f379073ac6cb43e1f3.
      - command: "python -m promedia backup-scope --json"
        status: PASSED
        observed: >
          Real CLI against the operator's own database: 11 permanent tables,
          excluded ['entity_locks','ingest_queue','storage_ledger'],
          media_included false.
    fabrications_introduced: []
    findings_from_own_tests:
      - >
        test_export_is_read_only FAILED as first written, on an audit_log row.
        The test was wrong, not the code: export-permanent-set is operator
        authority, so invoke() audits it — and an operation that writes the whole
        audit log to a path of the caller's choosing SHOULD leave a trace of
        having been used. Renamed to
        test_export_changes_nothing_except_recording_that_it_happened, which now
        asserts the exception explicitly rather than hiding it.
      - >
        test_the_evidence_chain_is_complete_in_the_artefact FAILED because the
        happy path never creates an `evidence` row — attest-declaration and
        determine-rights alone do not. The fixture now adds real evidence, so the
        artefact contains every permanent kind rather than only those a minimal
        path happens to produce.
    assumptions:
      - >
        `accounts` and `assets` are in the permanent set although neither is
        named in project.md 5.4's four bullets. They carry the IDENTITY the named
        records reference: without them a published-post record and its rights
        evidence point at ids with nothing behind them. No media bytes are
        involved — the asset row is not the asset.
      - >
        `credential_ref` (e.g. "x:handle") IS exported. It is a lookup key, not a
        secret, and the value it refers to lives only in the DPAPI store (T-022).
        Without it a restored account cannot be reconnected to its credential.
    open_items:
      - >
        The artefact is plaintext JSON. That is correct while it stays on this
        machine and contains no secret, but T-038 must decide encryption before
        it goes to any third party — the permanent set is the audit log and the
        entire publication history.
      - >
        Nothing has been RESTORED from an artefact yet. T-037 is the task, and
        until it passes, this is an export whose format has only ever been
        written, never read back into a database. AC-3 verifies integrity out of
        the artefact, which is necessary but not the same as a restore.
    decisions: [DR-006, DR-008]
    required_dimensions: [correctness, data_integrity, secrets_handling, audit_trail, backup_recovery, testing, documentation]
    review:
      - reviewer: "review-r003-0815"
        role: reviewer-agent
        at: "2026-08-15T00:00:00+04:00"
        summary: >
          Read backup.py's classify_tables/build/verify in full and traced
          PERMANENT_TABLES against schema.sql: every table named exists, and
          classify_tables() genuinely raises on an unclassified table (not
          just documented as doing so). integrity_hash is SHA-256 over
          canonical_json(payload) — deterministic, matching the
          two-exports-are-identical claim. AC-2/AC-5's secret and
          lock/ledger exclusions are structural (not in PERMANENT_TABLES at
          all, so no filtering step could forget them). Re-ran
          tests/test_backup.py: 17 passed.
          One finding worth carrying into T-037's review rather than
          duplicating here: integrity_hash authenticates the artefact against
          ITSELF only (no signing key), so it detects accidental corruption
          but not a deliberately crafted artefact — see T-037's review, since
          restore() is where that matters.
          Findings: none blocking on T-036 itself.
    independent_review:
      status: PASSED
      reviewed_by: "review-r003-0815"
      reviewed_at: "2026-08-15T00:00:00+04:00"
      note: >
        Independent review per Constitution section 7 (R-003). Reviewer did
        not implement T-036. Code and tests match every claimed acceptance
        criterion; no BLOCKING or IMPORTANT finding against this task's own
        scope. The self-hash-only integrity model is noted here and analysed
        against actual impact in T-037 (IMPORTANT there, since restore() is
        the consumer that trusts it).

  - id: T-037
    title: "Restore path — rebuild a working database from an export"
    objective: >
      A backup that has never been restored is a hypothesis. This is the task
      that turns it into a fact, and it is deliberately separate from T-036: the
      export is written by one piece of code and read by another, and a format
      only its own writer can read is the classic way this fails.
    change_class: data_model_change
    mode: critical
    owner_role: implementer
    assigned_model_tier: standard
    status: complete
    claimed_by: "claude-code-session-next3"
    depends_on: [T-036]
    blocks: [T-040]
    owned_paths:
      - promedia/core/schema.sql
      - promedia/core/db.py
      - promedia/core/backup.py
      - promedia/core/ops/backup.py
      - promedia/core/ingest.py
      - tests/test_restore.py
      - tests/test_migration.py
      - tests/test_db.py
      - tests/test_registry.py
      - tests/test_ops_forms.py
    owned_paths_note: >
      Three test files were added to the claim mid-task, each because a pin
      fired rather than because scope grew: test_db.py pinned schema_version 1,
      test_registry.py pins the operator-authority set, and test_ops_forms.py
      refuses a new mutating operation that has no probe value which would
      actually succeed. All three firing is the suite doing its job.
    verification:
      - command: "python -m pytest -p no:cacheprovider tests/test_restore.py tests/test_migration.py"
        status: PASSED
        observed: "27 passed (18 restore + 9 migration)"
      - command: "python -m pytest -p no:cacheprovider"
        status: PASSED
        observed: "459 passed (428 before this task)"
      - command: "python -m pytest -p no:cacheprovider tests/test_restore.py, with restore keeping assets exactly as exported"
        status: FAILED
        observed: >
          Sabotage of the defect this whole schema change exists to prevent — a
          restored asset claiming 'stored' with no bytes on disk. 3 failures:
          test_a_restored_asset_is_absent_not_stored,
          test_publishing_a_restored_asset_is_refused (the phantom walked
          through the media gate), and
          test_re_ingesting_the_original_file_restores_an_absent_asset (the
          recovery path silently became a no-op duplicate). Reverted; backup.py
          SHA-256 0fcd97ab3766ad9be10ca3a6a57dfa0eb52d606ad43317e1f5da49bd3a72b41f.
      - command: "python -m promedia backup-scope --json; fresh database schema version"
        status: PASSED
        observed: "Real CLI answers; a fresh database reports schema_version 2."
    acceptance_criteria:
      - id: AC-1
        statement: "An export restored into an empty database reproduces every permanent row, and provenance integrity verifies after the round trip."
        result: PASSED
        evidence: >
          test_every_permanent_row_survives_the_round_trip compares row counts
          per table across two separate databases;
          test_provenance_integrity_verifies_after_the_round_trip runs
          verify-provenance in the TARGET system and gets integrity_verified
          true, which is F-8 holding end to end rather than only inside the
          artefact. test_the_rights_position_is_intact_after_restore and
          test_the_audit_log_survives cover the other two permanent kinds.
      - id: AC-2
        statement: "Restoring refuses a schema version it does not understand rather than importing partially."
        result: PASSED
        evidence: >
          test_an_artefact_from_a_newer_schema_is_refused rewrites the schema
          version, re-hashes so integrity still passes, and asserts refusal plus
          an empty database — the refusal is not incidental to a hash failure.
          Artefact format version is checked separately from schema version.
      - id: AC-3
        statement: "Restore does not resurrect media the retention policy deleted, and does not reintroduce entity locks."
        result: PASSED
        evidence: >
          test_a_retention_deleted_asset_stays_deleted is the important one:
          'absent' must not launder 'deleted', or a backup becomes a side door
          around retention policy. test_entity_locks_are_not_reintroduced holds
          a lock in the source and asserts none in the target.
          test_a_restored_asset_is_absent_not_stored asserts object_path is NULL
          — a path on this machine would be a lie.
      - id: AC-4
        statement: "Restoring onto a non-empty database is refused, or is explicitly additive with a recorded reconciliation rule — never a silent merge."
        result: PASSED
        evidence: >
          test_restoring_into_a_non_empty_database_is_refused. Refusal rather
          than merge, because "which version of this row wins" has no generally
          correct answer and the audit log would silently gain or lose entries
          depending on it.
    findings_from_own_tests:
      - >
        A TRAP, nearly shipped, found by test_an_agent_cannot_restore. Every
        restore ATTEMPT is audited, refusals included. The emptiness check
        counted audit_log, so a first attempt that failed integrity wrote a
        denial entry — and every later attempt was then refused for a non-empty
        database caused entirely by the first. The operator's recovery path
        would have closed behind them at the worst possible moment. audit_log
        and schema_version are now exempt from the check
        (_EMPTINESS_EXEMPT), and test_a_restore_can_be_retried_after_a_failed_attempt
        pins it.
      - >
        audit_log ids are AUTOINCREMENT surrogates, and the target already holds
        entries from the restore attempt itself, so copying explicit ids
        collided on the primary key. They are re-sequenced on insert; nothing
        meaningful lives in the id, and order is preserved by `at`.
      - >
        storage.commit() was called with a positional third argument that does
        not exist in its signature. Caught immediately by the recovery test —
        worth recording because it is the kind of error that would have shipped
        had the recovery path been left untested on the reasoning that it is a
        rare branch.
    assumptions:
      - >
        Re-ingesting an absent asset keeps the SAME asset id. One of the two
        questions this task's design finding left open. Decided this way because
        the sealed provenance, the rights verdicts and the publication history
        all reference that id; minting a new one would strand them and make the
        recovery a fresh start rather than a continuation, which is the opposite
        of what a backup is for.
      - >
        The restored verdict continues to govern — the second open question.
        C-20 says the same asset, evidence and ruleset version must always
        produce the identical verdict, and media existence is explicitly not
        evidence (rights.media_state). So recovery of the bytes does not
        re-open the rights position, and does not need to.
      - >
        schema_version rows are NOT copied from the artefact. The database's
        version is a fact about THIS database and the migrations applied to it,
        not about the artefact; the artefact's version is used only to refuse a
        restore from a newer build.
    open_items:
