          Second sabotage, at the subtle point: the plausible weaker design is a
          bare "did you mean it?" flag. test_a_confirmation_goes_stale_when_the_basis_changes
          fails, which is the test that distinguishes a content-bound
          confirmation from an acknowledgement. Reverted and hash-verified.
      - command: "Live server on 127.0.0.1:8765 against a throwaway data directory, driven over real HTTP"
        status: PASSED
        observed: >
          Not TestClient: a real uvicorn process, real cookie exchange from the
          startup URL, real Origin headers. Submitting approve-post returned the
          confirmation screen showing account 'demo', verdict PERMITTED, ruleset
          'conservative 1.0.0' and the 64-hex asset hash, with the post still
          'queued'. A forged confirmation left it queued. A confirmation issued
          before new model evidence degraded the verdict PERMITTED -> ESCALATE
          left it queued. Confirming the current facts approved it.
          The instance was pointed at a sandbox data directory, so unlike T-034's
          browser pass this one could exercise the MUTATING operations.
      - command: "Browser rendering of the confirmation screen"
        status: NOT_RUN
        observed: >
          The Browser pane was not compositing in this session — screenshots time
          out and synthetic keystrokes do not reach the page, so form submissions
          never left the browser (verified: only GETs appear in the network log).
          The HTTP-level check above exercises the same server and the same
          rendered HTML, but nobody has LOOKED at this screen. For a task whose
          entire subject is what a human sees before deciding, that gap is worth
          naming rather than glossing: OD-5's human-experience pass is the right
          place to close it.
    fabrications_introduced: []
    assumptions:
      - >
        The rule is DERIVED (operator authority + mutates + entity 'post' +
        declares post_id) rather than a name list in the adapter, so a future
        operator decision on a post inherits it on the day it is registered.
        Pinned as the current set {approve-post, publish-post,
        release-publish-claim} by test_the_rule_is_derived_not_a_hardcoded_list.
      - >
        release-publish-claim is included by that rule. It is recovery rather
        than authorisation, so the confirmation is arguably surplus there — but
        it is an operator write to a post, showing its state first is harmless,
        and carving out an exception would reintroduce the name list.
    open_items:
      - >
        ENTITY_LOCKED now surfaces on the CONFIRMED submission of /ops/{name}
        rather than the first, because the confirmation step executes nothing and
        cannot report an execution-time condition. T-032's contract is unchanged
        (409 on the request that attempts the write) and the adapter deliberately
        does NOT pre-check the lock table, which would put C-19 logic in a
        surface. tests/test_surface_signals.py updated to match, and rewritten to
        use a post that really exists — the module's phantom CONTENDED_POST now
        correctly answers 404 on this route, which is a fixture artefact rather
        than a behaviour question.
      - >
        The confirmation is a UI affordance, not a security control. An agent
        with the operator token can still POST /api/op/approve-post directly, as
        it always could and as the CLI does. That is deliberate — F-1 requires
        the capability on both surfaces — but it means this task closes a
        human-experience gap and nothing more.
    decisions: [DR-002, DR-004]
    required_dimensions: [human_experience, correctness, documentation, testing]
    independent_review:
      status: NOT_RUN
      note: >
        Constitution section 7 — implemented by this session and NOT yet reviewed
        by another agent. Both sabotage rounds are self-verification. This task
        came out of independent review of T-034, so leaving its own fix
        unreviewed is exactly the asymmetry OD-6 records.

# ---------------------------------------------------------------------------
# Independent review, round 3 — the T-023/T-024/T-025 hardening.
# ---------------------------------------------------------------------------

review_round_3:
  verdicts:
    T-023: RESOLVED
    T-024: RESOLVED
    T-025: "405 rule RESOLVED; origin check reopened for N8, then fixed"
    I3: RESOLVED

  reviewer_probes_that_found_nothing:
    - "11 input shapes for a secret canary (CLI abbreviations, query-only, query+form, repeated params, GET, JSON body, form body) — absent from iterdump, audit log, and every response"
    - "All 29 operations enumerated against the GET/405 rule — zero mismatches in either direction"
    - "Account reconnect under FK pressure and during an in-flight publish — id preserved, no drift"
    - "Every classic origin bypass — null, prefix-extension, port, scheme, case, Referer-precedence — all correctly refused"

  new_findings_fixed_in_this_run:
    - id: N8
      severity: IMPORTANT
      summary: >
        The origin check derived its baseline from request.url.netloc — the
        client-supplied Host header — so an attacker controlling both Host and
        Origin matched its own forgery. The reviewer put a state change through
        that way. Every other vector was correctly refused; only the
        self-referential baseline failed.
      fix: "promedia/web/app.py — baseline comes from web.host/web.port in Config; comparison is structural (hostname, port), not string-prefix"
      regression_test: tests/test_hardening.py::test_host_header_rebind_cannot_forge_same_origin
      verified: "Confirmed to fail when the baseline is reverted to request-derived"

    - id: N9
      severity: IMPORTANT
      summary: >
        The operator token — which grants publish authority over every account —
        was exempt from the query-string rule T-024 had just imposed on platform
        credentials. POST /api/op/publish-post?token=... published successfully.
      fix: "X-ProMedia-Token header or cookie; ?token= refused on /api/op/* and retained only as the one-time bootstrap on /"
      regression_test: tests/test_hardening.py::test_token_in_query_cannot_publish

    - id: N10
      severity: IMPORTANT
      summary: >
        A bare reconnect (no secret — a plausible slip) set a live account to
        status 'error'. Pre-existing expression, made destructive by T-023
        preserving the row instead of minting a new one.
      fix: "promedia/core/ops/accounts.py — status left untouched when no secret is supplied"
      regression_test: tests/test_hardening.py::test_bare_reconnect_does_not_downgrade_a_working_account

    - id: N11
      severity: IMPORTANT
      summary: >
        account.status was written but never read, so the system could report an
        account as broken and publish to it anyway.
      fix: "promedia/core/posts.py — publish refuses a non-connected account; status surfaced in decision_context"
      regression_test: tests/test_hardening.py::test_publish_refuses_an_account_that_is_not_connected

    - id: N12
      severity: OPTIONAL
      summary: >
        --secret was blocked only by argparse abbreviation AMBIGUITY, which is an
        accident rather than a control, and the error did not say what to do.
      fix: "allow_abbrev=False plus an explicit suppressed --secret that consumes its value and errors with the alternatives, without echoing the value"
      regression_test: tests/test_hardening.py::test_inline_secret_flag_gives_actionable_error

    - id: N13
      severity: OPTIONAL
      summary: "handle was not case-normalised while platform was, so x/Case and x/case became two accounts"
      fix: "promedia/core/ops/accounts.py — handle lowercased for the lookup key"
      regression_test: tests/test_hardening.py::test_handle_is_case_normalised

    - id: N14
      severity: OPTIONAL
      summary: >
        The round-2 tests asserted the entry points but not the end state — no
        iterdump or audit-log check on the secret, and no Host-rebind case, which
        is exactly why N8 survived.
      fix: "tests/test_hardening.py — canary asserted absent from database, audit log and every response; Host-rebind and 6 origin vectors added"

  reviewer_statement_corrected:
    claim: "Round 3 closed by listing N1 and N4 as 'still open from earlier rounds, unchanged'."
    finding: >
      Both were already fixed in commit 1aa06da, before round 3 began. Verified
      by inspection and by executing their regression tests
      (test_exception_text_never_reaches_the_audit_log,
      test_reporting_operations_agree_with_the_gate) — both pass, registry.py
      audits the exception TYPE only, and ops/rights.py routes through
      effective_verdict. Recorded because an inherited "still open" would have
      sent the next agent to re-fix working code.

