  - id: T-038
    title: "Off-site destination and transport"
    objective: >
      Where the artefact goes, and what protects it there. NEEDS AN OPERATOR
      DECISION before it can be implemented, and it is isolated here so that
      nothing else waits on that decision.
      The choice is not a technical detail: "off-site" means the permanent set —
      rights evidence, the audit log, publication history — leaves this machine.
      C-31 caps spend at $100/month total, DR-009 recorded a confirmed
      self-hosted-no-cloud posture for the scheduler, and whether that posture
      extends to backup storage is the operator's call, not an inference.
      Options to put to the operator: an external/removable drive (no third
      party, manual rotation, no recurring cost); a consumer cloud drive already
      paid for; or object storage priced per GB. At megabyte scale every option
      is effectively free, so this is a trust and habit decision rather than a
      cost one — which is exactly why it must not be guessed.
