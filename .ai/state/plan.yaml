# .ai/state/plan.yaml — the project plan as a tree.
# Schema: aef/schemas/plan.schema.yaml   Protocol: aef/protocols/04-planning.md
#
# WHAT THIS FILE IS, AND IS NOT
#
# It is the STRUCTURE of the work: how the project decomposes, what weight each
# piece carries, and which agent owns it.
#
# It is NOT the status of the work. Every leaf below links a task in
# tasks.yaml, and that task's `status:` is the only place its state is written.
# Group status and every percentage on the dashboard are DERIVED on read and
# stored nowhere. Two places to answer "is this done?" is two answers, and the
# second one is wrong — this project has already paid for that lesson twice
# (T-031, and the tautological parity gate in T-028).
#
# `aef/tools/aef.py validate` fails if any task is missing from this tree or
# claimed by two nodes, so the denominator of the percentage cannot silently
# drift from the real task set.
#
# Retrofitted 2026-08-12 from the flat task list produced by protocol 04 at
# plan_version 1. The tasks themselves were not renumbered, rewritten or
# rescoped — only arranged. See DR-012.

meta:
  plan_version: 3
  schema_version: 1
  project: ProMedia
  aef_version: 0.5.2
  planned_at: 2026-08-08
  restructured_at: 2026-08-12
  replanned_at: 2026-08-16
  replanned_by_role: architect
  replan_note: >
    plan_version 2 -> 3: T-060's planning pass (DR-019..DR-023). N-060's
    single deferred placeholder is unchanged (now records the completed
    planning pass itself) and gains a sibling section, S-V2-ROOMS-2, with
    eight new leaves (N-064..N-071 / T-064..T-071) for the five items it
    named: Color room, Audio room, brand kits, content calendar, model
    marketplace. No existing task was renumbered, rewritten or rescoped.
  planned_by_role: analyst
  mode: critical

  # Protocol 04 requires the planner to state coverage explicitly rather than
  # let an unstated gap read as "nothing to do".
  completeness:
    declared_complete: true
    basis: >
      Retrofit of an executed plan, not a forecast. Every task that exists in
      tasks.yaml appears here exactly once, which the validator enforces. The
      v1 slice boundary recorded in tasks.yaml meta.slice still holds: work
      outside it is present as deferred tasks (T-018, T-019, T-022), not
      omitted.
    known_omissions:
      - >
        CLOSED 2026-08-13. Off-site backup of the permanent set was in scope per
        project.md 5.4 with no task. The planning pass it asked for has now been
        done and produced section S-DURABILITY (T-036..T-040), so the omission
        is a plan rather than a sentence. Left visible rather than deleted: an
        omission that vanishes when it is fixed teaches nothing about how long
        it sat open.
        Its shape, once looked at: the permanent set maps to ten SQLite tables
        and is megabytes because masters are transient, so the work is not
        storage but proof — that no credential rides along (DR-008), that
        provenance integrity still verifies after a round trip (F-8), and that a
        restore has actually been performed rather than assumed (T-040).
      - >
        The independent human-experience review (OD-5) is an operator action,
        not an agent task, so it is deliberately not a node. It remains open in
        the completion report.
      - >
        OPEN, and the reason is a decision rather than an oversight: there is
        still no OFF-SITE copy of the permanent set. OD-7 (2026-08-13) chose to
        keep the artefact on this machine for now, so T-038/T-039/T-040 are
        blocked behind that choice. A local backup does not satisfy project.md
        5.4's "must survive disk loss" — one disk failure takes the database and
        its backup together. It does protect against deletion, a bad migration
        and corruption. Named here because a durability gap that lives only in a
        blocked task reads, from the dashboard, as work merely not started yet.

