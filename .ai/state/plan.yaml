          title: Origin and method guards on mutating operations
          task: T-025
        - id: N-026
          agent: backend-agent
          type: task
          title: Namespace and relocate the operator token
          task: T-026
        - id: N-027
          agent: backend-agent
          type: task
          title: Enforce C-19 entity ownership in the operation layer
          task: T-027
        - id: N-031
          agent: security-agent
          type: task
          title: One authority on which operations exist
          task: T-031
        - id: N-033
          agent: security-agent
          type: task
          title: Lock the account reconnect path
          task: T-033
        - id: N-022
          agent: security-agent
          type: task
