id: DR-013
title: Adopt AEF 0.2.0 — plan-before-execute, plan tree, agent assignment, dashboard
date: 2026-08-12
status: accepted
decided_by: operator
recorded_by: orchestrating session
decision_area: framework_version_and_project_planning_substrate

numbering_note: >
  Written first as DR-012 and renumbered. The T-032 session held a lock on
  .ai/state/decisions/DR-012.yaml (see locks.yaml) and this session created a
  file at that path without checking — a direct breach of Constitution rule 3,
  "claim a file lock before editing; never edit a path owned by another agent."
  No content was lost: T-032's record is intact and is the sole occupant of
  DR-012. Recorded here rather than quietly corrected, because a silent
  renumbering is exactly how the next agent learns the wrong lesson. See
  open_items.

context: >
  The operator asked for four related changes to AEF itself: plan every project
  A to Z before executing it, represent that plan as a tree, compute completion
  from the real task set rather than by hand, and assign agents to tasks both
  automatically and manually — with a light, separate view of progress.

  AEF 0.1.0 could not express any of it. tasks.yaml is a flat list with
  depends_on, there is no hierarchy, no notion of an assignable agent (only
  owner_role and a model tier), and protocol 04 was 31 lines that never
  mentioned completeness. The framework also had no executable layer at all: it
  is markdown and YAML, so "a dashboard" meant AEF growing a runtime for the
  first time in its life.

the_read_only_question:
  problem: >
    CLAUDE.md forbids editing anything under aef/ in the strongest terms, and
    that rule is the reason the framework layer is trustworthy. This work
    required writing inside aef/.
  resolution: >
    The constitution supplies the sanctioned path: "To change the framework
    itself, bump the pinned version deliberately — never by editing in place."
    The operator authorised the change directly in session and chose the version
    bump over the alternatives offered (staging the new version outside aef/ for
    review, or extracting AEF to its own repository first).
    aef/VERSION 0.1.0 -> 0.2.0, with a CHANGELOG entry and this record.
  what_the_rule_still_means: >
    Unchanged for ordinary work. A project agent may not edit aef/ to change how
    its project behaves — .ai/config/overrides.yaml exists for that, and every
    extension point added in 0.2.0 (the agent catalogue, the assignment rules)
    is overridable there. What happened here is framework authorship: a
    different act, performed deliberately by the framework's author, recorded
    rather than quietly done.
  upstream: >
    NOT YET PUSHED. OD-1 records that AEF's own repository is Safu1islam/aef.
    This working copy is vendored with no git remote, so 0.2.0 currently exists
    only here. Publishing it upstream and re-pinning is outstanding.

decision: >
  Two state files with one authority each, plus a stdlib-only tool layer.

    .ai/state/plan.yaml   structure, weight, agent assignment
    .ai/state/tasks.yaml  task status and its evidence
    derived on read       group status, percentages, agent workload

  Grouping nodes have no stored status and no stored percentage. Both are
  computed on every read, and a validator enforces that every task appears as
  exactly one leaf, so the denominator of the percentage cannot drift from the
  real task set.

alternatives_considered:

  - option: One file — extend tasks.yaml with nested children
    rejected_because: >
      ProMedia's tasks.yaml is 1,638 lines of task records and review narrative.
      Threading a hierarchy through it would have meant rewriting the file that
      carries every acceptance criterion and verification result in the project,
      for a structural change that touches none of them. Two files with a
      validated seam keeps the risky edit away from the evidence.

  - option: Store rolled-up status and percentage on each node
    rejected_because: >
      It would create a second answer to "is this done?", and this project has
      already paid for that twice — T-031 (a decorative operations dict whose
      entries still executed) and T-028 (a parity test that compared a value to
      itself and could not fail). Derivation cannot go stale.

  - option: Node.js for the dashboard
    rejected_because: >
      Node 24 is present on this machine, but AEF is copied into projects whose
      stack it does not know, and a build step would be the first thing to break
      there. Python 3.11 is the confirmed toolchain here (project.md §6).

  - option: Require PyYAML
    rejected_because: >
      Breaks the no-install contract that lets AEF drop into an unknown project.
      Resolved by using PyYAML when importable and falling back to a bundled
      reader, with a differential test that parses the project's real state
      files with both and asserts equality. See verification.

  - option: Static generated HTML, no server
    rejected_because: >
      Lighter, but it goes stale between regenerations and cannot answer "what
      is happening now". The server re-reads the files per request and is 60
      lines of stdlib.

  - option: Put the progress button in ProMedia's own web UI
    rejected_because: >
      Couples the framework to one project's templates. The dashboard is
      self-contained, so it works identically in the next project, which is the
      entire point of AEF being copied in.

consequences:
  positive:
    - Planning is now a gate with an executable check, not an intention.
    - The completion percentage cannot be manually inflated; it is computed from
      task status, and removing a node to improve it is explicitly forbidden by
      protocol 04.
    - Agent assignment reuses change_class, so one classification drives mode,
      reviewers, quality dimensions and ownership instead of four opinions.
    - Weak assignment bases are labelled weak, which exposes unclassified tasks
      rather than hiding them behind a plausible-looking agent name.
  negative:
    - AEF now contains code, and code rots in a way documents do not. Mitigated
      by the stdlib-only contract and by tests that ship alongside it.
    - A bundled YAML parser is a liability if it is ever wrong. Mitigated by
      differential testing against PyYAML and by refusing unknown constructs
      loudly, but it remains the most fragile thing in the framework.
    - plan.yaml and tasks.yaml can drift. Mitigated by `validate`, which must be
      run — nothing forces it yet.

verification:
  - check: aef/tools/run_tests.py
    status: PASSED
    observed: "51 tests, OK"
  - check: Bundled YAML reader vs PyYAML on all 21 real state files
    status: PASSED
    observed: >
      21/21 identical, with force_bundled=True. An earlier run of this same
      comparison reported 19/19 OK and was WORTHLESS — force_bundled defaulted
      to False, so it compared PyYAML against itself. The bundled parser was in
      fact failing on `- >` sequence block scalars, multi-line quoted scalars,
      multi-line plain scalars, trailing comments after scalars, integer keys,
      date resolution, and blank-line folding around more-indented lines. All
      seven were found only after forcing the flag, and
      test_the_forced_flag_actually_bypasses_pyyaml now exists so that mistake
      cannot recur silently.
  - check: The tests can fail — deliberate sabotage of the rollup precedence
    status: FAILED
    observed: >
      Intentional. Removing the failed-outranks-everything branch from _rollup
      produced exactly 1 failure, test_a_failed_child_outranks_everything,
      "'in_progress' != 'failed'". Restored and re-run: 51 passed.
  - check: aef/tools/aef.py validate against the migrated ProMedia plan
    status: PASSED
    observed: "plan OK — 31 leaves, 31 tasks, all accounted for"
  - check: Dashboard rendered in a real browser at 1280 and 375 wide
    status: PASSED
    observed: >
      77% (24/31), matching a hand count of tasks.yaml. Section rollups correct.
      No horizontal overflow at either width with every node expanded. Filtering
      by agent returns 9 for security-agent and the status filter returns the 1
      blocked task, both matching the progress view's independently computed
      totals. No console errors.
  - check: ProMedia's own test suite unaffected
    status: PASSED
    observed: >
      Re-run 2026-08-13 now that T-032 has landed and both sessions' edits are
      settled in the working tree: `python -m pytest -p no:cacheprovider` ->
      322 passed, 1 warning in 81.91s. Matches T-032's own claimed count
      exactly (309 before it, +13 from tests/test_surface_signals.py plus the
      unification's ripple through existing assertions). No flake observed on
      this run. `python aef/tools/aef.py validate` -> "plan OK — 31 leaves, 31
      tasks, all accounted for". `python aef/tools/run_tests.py` -> 51 passed,
      confirming the framework layer's own suite alongside the project's.

open_items:
  - >
    LOCK BREACH, this session. .ai/state/decisions/DR-012.yaml was written
    without checking locks.yaml, where T-032 had claimed it. The framework's
    own rule 3 was broken by the session extending the framework, which is
    worth more than the renumbering that fixed it: the tooling added here reads
    plan.yaml and tasks.yaml but never consults locks.yaml, and an `aef claim`
    command would have made the check cheaper than skipping it. Candidate for
    0.3.0.
  - >
    0.2.0 is not published to Safu1islam/aef. Until it is, this project is
    pinned to a version that exists nowhere else, which defeats the point of
    pinning.
  - >
    `validate` is not wired into any gate. It is a command someone must
    remember. A pre-commit hook or a test would make the plan/task seam
    enforced rather than merely checkable.
  - >
    The bundled reader is verified against this project's files, which is a real
    but narrow corpus. A project using YAML constructs AEF's own files never use
    will meet the refusal path rather than a wrong answer — that is the intended
    failure mode, but it is untested against a genuinely different codebase.
  - >
    Independent review. This change was designed and implemented in one session.
    Constitution §7 — not yet reviewed by another agent.

relates_to: [DR-002]
