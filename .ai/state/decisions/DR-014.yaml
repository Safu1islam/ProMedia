  - check: "Dashboard rendered in a browser at http://127.0.0.1:7423/progress"
    status: PASSED
    observed: >
      Live coordination notices panel present with 4 entries; three rows under
      "Being worked on now" each carrying a lock chip naming the holding
      session; "Coming next" reduced to T-022 and T-018.
  - check: "aef.py doctor, and the bundled YAML reader"
    status: PASSED
    observed: >
      Tools and aef/VERSION both 0.3.0. Bundled reader agrees with PyYAML on
      locks.yaml as well as plan.yaml and tasks.yaml, and
      `--force-bundled progress` produces identical output. AEF ships without
      PyYAML, so this path is not optional.
  - check: "ProMedia's own test suite unaffected by THIS work"
    status: PASSED
    observed: >
      Established by scope, not by a green run, because a green run was not
      available. Every file changed here is under aef/, .ai/state/ or .claude/.
      Nothing under promedia/ or tests/ was touched, and no module in either
      imports aefkit — aef/tools is invoked as a script and is not on the
      application's import path. `git diff --name-only` confirms the split.
  - check: "Full ProMedia suite, run at 02:5x on 2026-08-13"
    status: FAILED
    observed: >
      1 failed, 358 passed, 1 warning in 81.05s. The failure is
      tests/test_surface_signals.py::test_contended_entity_is_409_on_the_generic_form_route.
      NOT CAUSED BY THIS WORK, and not this session's to fix:
      claude-code-session-next3 holds live locks on T-030/T-033/T-035 and is
      editing those paths right now. An earlier run in the same window reported
      3 failures and a later one reported 1, so the tree is changing between
      measurements. That session's own lock note in locks.yaml states it is
      rewriting test_ops_forms.py as part of T-035.

      Recorded as FAILED rather than omitted. The baseline before this session
      began was 322 passed; the count is now 359 collected because the other
      session has added tests/test_account_locking.py and tests/test_hygiene.py.
      A clean full-suite result for ProMedia is NOT_RUN until those three tasks
      land, and that is the honest status.

not_verified:
  - >
    Multi-project behaviour. Everything here was exercised against this
    repository's own state files plus synthetic fixtures in the test suite. AEF
    is meant to be copied into other projects, and no other project has run it.
  - >
    A lock whose expiry passes WHILE the dashboard page is open. The server
    re-reads state on every request, so a refresh is correct, but nothing pushes
    the change to an already-rendered page and there is no auto-refresh.

open_items:
  - >
    The AEF-0.3.0 lock itself raises a coordination notice, because its task id
    is framework authorship and appears in no project task file. That is a true
    statement and is left visible rather than special-cased: work happening in
    this repository that the project plan does not know about is worth seeing.
  - >
    Three tasks are recorded as being worked on by claude-code-session-next3 on
    the strength of their locks. This session did not touch T-030, T-033 or
    T-035, or any path they claim, per the operator's instruction to respect
    those locks.
