# ProMedia — project configuration overrides.
#
# This file is deep-merged OVER aef/config/framework.yaml. Project keys replace
# framework keys at the same path; keys absent here inherit the framework default.
# Never edit aef/config/framework.yaml to change behaviour in this project —
# aef/ is read-only. Override here instead.

autonomy:
  # Operator authorisation 2026-08-08: run intake -> technology selection ->
  # planning -> implementation -> verification -> review -> completion without
  # checking in between stages.
  default_level: solo

  # Reduced from the framework default of
  # [technology_selection, plan_approved, pre_production] to a single gate.
  # pre_production is retained deliberately: routing.yaml classifies this work as
  # `new_project` and `auth_or_permissions`, both mode `critical`, which sets
  # require_human_approval. Publishing publicly and provisioning paid resources
  # are also NON-NEGOTIABLES.md list B. The gate is where those land.
  checkpoint_gates: [pre_production]
